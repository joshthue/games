<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ultimate Texas Hold'em</title>

<style>
  :root{ --felt:#0d5c3f; --felt2:#0a4a33; --wood:#8a5a2b; --wood2:#6b4420;
    --gold:#f0c674; --cream:#f7f3e8; --ink:#1c2a24; --red:#c22; --green:#178a3a; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(circle at 50% 12%, var(--felt) 0%, var(--felt2) 70%, #063324 100%);
    color:var(--cream); min-height:100vh; overflow-x:hidden; display:flex; flex-direction:column; align-items:center;}
  .wrap{width:100%; max-width:820px; padding:8px 12px 44px; position:relative;}
  header{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:4px;}
  h1{font-size:18px; margin:0; letter-spacing:1px; color:var(--gold); text-shadow:0 1px 2px rgba(0,0,0,.5);}
  h1 small{display:block; font-size:9.5px; letter-spacing:2px; opacity:.7; font-weight:600;}
  .top-btns{display:flex; gap:6px;}
  button{font-family:inherit; cursor:pointer; border:none; border-radius:10px; font-weight:600; transition:transform .06s, filter .15s;}
  button:active{transform:translateY(1px) scale(.98);}
  .btn{background:var(--gold); color:var(--ink); padding:9px 14px; font-size:14px; box-shadow:0 2px 5px rgba(0,0,0,.35);}
  .btn.sec{background:rgba(255,255,255,.14); color:var(--cream);} .btn.sm{padding:6px 10px; font-size:12px;}
  .btn.play{background:var(--green); color:#fff;} .btn.fold{background:rgba(255,255,255,.14); color:var(--cream);}
  .btn.check{background:rgba(255,255,255,.2); color:var(--cream);}
  .btn:disabled{opacity:.4; cursor:default;}
  a.btn{text-decoration:none; display:inline-block;}
  input.txtinp{font-family:inherit; font-size:16px; width:100%; padding:10px; border-radius:10px;
    border:2px solid var(--gold); background:rgba(0,0,0,.25); color:var(--cream);}

  .chipbar{display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap;
    background:linear-gradient(180deg,var(--wood),var(--wood2)); border-radius:12px; padding:9px 12px; margin:4px 0 6px;
    box-shadow:inset 0 2px 6px rgba(0,0,0,.3),0 3px 8px rgba(0,0,0,.4); color:#2b1a08; font-weight:800; font-size:15px;}
  .chipbar .chips{background:var(--gold); color:#111; border-radius:20px; padding:3px 14px;}
  .chipbar .net{font-size:16px; font-weight:800; background:rgba(0,0,0,.45); color:var(--cream);
    border-radius:20px; padding:3px 13px; letter-spacing:.2px;}
  .chipbar .net.up{color:#8ff0a8;} .chipbar .net.down{color:#ff9a9a;}
  .wagers{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; font-size:12px; margin:0 0 4px; min-height:16px;}
  .wag{background:rgba(0,0,0,.28); border-radius:10px; padding:2px 9px;} .wag b{color:var(--gold);} .wag.off{opacity:.4;}

  .zone-label{text-align:center; font-size:11px; letter-spacing:1px; text-transform:uppercase; opacity:.65; margin:8px 0 3px;}
  .handrow{display:flex; gap:6px; justify-content:center; min-height:58px; align-items:center; flex-wrap:wrap;}
  .handname{text-align:center; font-size:13px; color:var(--gold); font-weight:700; min-height:17px; margin-top:2px;}
  .status{min-height:36px; text-align:center; font-size:14px; margin:6px 0; color:var(--gold); font-weight:600;
    display:flex; align-items:center; justify-content:center; padding:0 6px;}

  .card{width:46px; height:66px; border-radius:8px; background:var(--cream); color:var(--ink); position:relative;
    box-shadow:0 2px 5px rgba(0,0,0,.4); flex:0 0 auto; user-select:none; border:1px solid #d8d2c0;}
  .card .rank{position:absolute; top:3px; left:5px; font-size:14px; font-weight:800; line-height:1;}
  .card .rankb{position:absolute; bottom:3px; right:5px; font-size:14px; font-weight:800; line-height:1; transform:rotate(180deg);}
  .card .pip{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:23px;}
  .card.back{background:repeating-linear-gradient(45deg,#1b6fb3,#1b6fb3 6px,#155a94 6px,#155a94 12px); border:2px solid #0e3f6b;}
  .card.win{box-shadow:0 0 0 2px var(--gold), 0 0 12px rgba(240,198,116,.6), 0 3px 8px rgba(0,0,0,.4);}
  .card.slot{background:rgba(0,0,0,.15); border:1px dashed rgba(255,255,255,.18); box-shadow:none;}

  .stepper{display:flex; align-items:center; justify-content:center; gap:16px; margin:4px 0;}
  .stepper button{width:40px; height:40px; border-radius:50%; background:var(--gold); color:var(--ink); font-size:22px; font-weight:800;}
  .stepper button:disabled{opacity:.35;}
  .stepper .val{font-size:22px; font-weight:800; min-width:56px; text-align:center;}
  .betbox{max-width:360px; margin:4px auto 0;}
  .betlabel{text-align:center; font-size:13px; opacity:.85; margin-top:6px; letter-spacing:.3px;} .betlabel b{color:var(--gold);}
  .controls{display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin-top:12px;}
  .notes{max-width:470px; margin:2px auto 0;}
  .note{background:rgba(0,0,0,.22); border-left:3px solid var(--gold); border-radius:8px; padding:7px 11px; margin:6px 0; font-size:13px; line-height:1.45;}
  .note.win{border-left-color:var(--green);} .note.lose{border-left-color:var(--red);}
  .bigresult{font-size:17px; font-weight:800; text-align:center; margin:4px 0;}
  .bigresult.win{color:#8ff0a8;} .bigresult.lose{color:#ff9a9a;} .bigresult.push{color:var(--cream);}

  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.62); display:none; align-items:center; justify-content:center; z-index:50; padding:16px;}
  .overlay.show{display:flex;}
  .panel{background:linear-gradient(180deg,#12503a,#0c3d2c); border:2px solid var(--gold); border-radius:16px;
    max-width:520px; width:100%; max-height:88vh; overflow-y:auto; padding:18px; box-shadow:0 10px 40px rgba(0,0,0,.6);}
  .panel h2{margin:0 0 6px; color:var(--gold); font-size:20px;} .panel h3{color:var(--gold); font-size:15px; margin:14px 0 6px;}
  .panel p,.panel li{font-size:14px; line-height:1.5;} .panel ul{margin:4px 0 4px 2px; padding-left:20px;}
  .panel table{width:100%; border-collapse:collapse; font-size:13px; margin:4px 0;}
  .panel td{padding:3px 6px; border-bottom:1px solid rgba(255,255,255,.12);} .panel td:last-child{text-align:right; color:var(--gold); font-weight:700;}
  .panel .close{position:sticky; top:0; float:right;}
  .switch{display:flex; align-items:center; gap:8px; font-size:13px;}
  .seg{display:inline-flex; vertical-align:middle; background:rgba(0,0,0,.3); border-radius:20px; padding:3px; gap:3px;}
  .seg button{background:transparent; color:var(--cream); padding:6px 14px; font-size:13px; border-radius:16px;}
  .seg button.on{background:var(--gold); color:var(--ink);} .seg button:disabled{cursor:default;}
  .toggle{width:44px; height:24px; border-radius:14px; background:rgba(0,0,0,.4); position:relative; padding:0; flex:0 0 auto;}
  .toggle::after{content:""; position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:var(--cream); transition:left .18s;}
  .toggle.on{background:var(--gold);} .toggle.on::after{left:22px;}
  .tiprow{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin:8px 0;}
  .tip-block{background:rgba(0,0,0,.22); border-left:3px solid var(--gold); border-radius:8px; padding:8px 12px; margin:8px 0; font-size:14px; line-height:1.5;} .tip-block b{color:var(--gold);}
  .setup-opt{display:block; width:100%; text-align:left; background:rgba(255,255,255,.1); color:var(--cream); padding:13px 14px; border-radius:10px; margin:7px 0; font-size:15px; text-decoration:none;}
  .float-tip{position:fixed; bottom:16px; right:16px; z-index:40;}
  .float-tip button{width:54px; height:54px; border-radius:50%; font-size:24px; background:var(--gold); color:var(--ink); box-shadow:0 4px 12px rgba(0,0,0,.5);}
  .muted{opacity:.75; font-size:12px;}
  @media(max-width:430px){ .card{width:40px;height:58px;} .card .pip{font-size:20px;} .card .rank,.card .rankb{font-size:12px;} h1{font-size:16px;} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>♠ ULTIMATE TEXAS HOLD'EM <small>ANTE · BLIND · PLAY</small></h1>
    <div class="top-btns">
      <a class="btn sec sm" href="../" title="All games">🏠</a>
      <button class="btn sec sm" id="rulesBtn">Rules</button>
      <button class="btn sec sm" id="menuBtn">Menu</button>
    </div>
  </header>

  <div class="chipbar" id="chipbar"></div>
  <div class="wagers" id="wagers"></div>

  <div class="zone-label">Dealer</div>
  <div class="handrow" id="dealerRow"></div>
  <div class="handname" id="dealerName"></div>

  <div class="zone-label">Board</div>
  <div class="handrow" id="boardRow"></div>

  <div class="status" id="status">Loading…</div>

  <div class="zone-label">Your hand</div>
  <div class="handrow" id="holeRow"></div>
  <div class="handname" id="holeName"></div>

  <div id="bets"></div>
  <div class="controls" id="controls"></div>
</div>

<div class="float-tip" id="floatTip"><button id="tipBtn" title="Tips">💡</button></div>
<div class="overlay" id="overlay"><div class="panel" id="panel"></div></div>

<script>
/* ============================================================
   ULTIMATE TEXAS HOLD'EM — heads-up vs the dealer.
   Ante + Blind (equal), optional Trips side bet, one Play bet
   made at 4x/3x (pre-flop), 2x (flop) or 1x (river) — or fold.
   ============================================================ */
const SUITS=["♠","♥","♦","♣"], SUIT_RED=[false,true,true,false];
const RSTR={11:"J",12:"Q",13:"K",14:"A"};
const FOURCOL=["#1c2a24","#c22","#1b6fb3","#178a3a"];
const CAT5NAME={8:"Straight flush",7:"Four of a kind",6:"Full house",5:"Flush",4:"Straight",3:"Three of a kind",2:"Two pair",1:"Pair",0:"High card"};
const TRIPS={3:3,4:4,5:7,6:8,7:30,8:40}, TRIPS_ROYAL=50;   // pays to 1
const BLIND={4:1,5:1.5,6:3,7:10,8:50}, BLIND_ROYAL=500;    // pays to 1 (flush 3:2)
const START_BANK=100, MINBET=5, MAXBET=25;

let settings={tipsOn:false, tipLevel:"beginner", playerName:"You", fourColor:true, speed:true};
let U=null;
let curOverlay={kind:null};

function rankStr(r){return RSTR[r]||String(r);}
function suitColor(s){ return settings.fourColor ? FOURCOL[s] : (SUIT_RED[s]?"#c22":"#1c2a24"); }
function makeDeck(){const d=[];for(let s=0;s<4;s++)for(let r=2;r<=14;r++)d.push({r,s});return d;}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function cardEl(c,opts={}){
  const d=document.createElement("div");
  if(opts.slot){ d.className="card slot"; return d; }
  if(opts.back||!c){ d.className="card back"; return d; }
  d.className="card"+(opts.cls?(" "+opts.cls):"");
  d.style.color=suitColor(c.s);
  d.innerHTML=`<span class="rank">${rankStr(c.r)}</span><span class="pip">${SUITS[c.s]}</span><span class="rankb">${rankStr(c.r)}</span>`;
  return d;
}

/* ---- 5-card hand ranking ---- */
function rank5(cs){
  const ranks=cs.map(c=>c.r).sort((a,b)=>b-a);
  const suits=cs.map(c=>c.s);
  const flush=suits.every(s=>s===suits[0]);
  const uniq=[...new Set(ranks)].sort((a,b)=>b-a);
  let straight=false,sHigh=0;
  if(uniq.length===5){
    if(uniq[0]-uniq[4]===4){straight=true;sHigh=uniq[0];}
    else if(uniq[0]===14&&uniq[1]===5&&uniq[4]===2){straight=true;sHigh=5;}   // wheel A-2-3-4-5
  }
  const cnt={}; ranks.forEach(r=>cnt[r]=(cnt[r]||0)+1);
  const groups=Object.keys(cnt).map(r=>[cnt[r],+r]).sort((a,b)=> b[0]-a[0] || b[1]-a[1]);
  const counts=groups.map(g=>g[0]), byC=groups.map(g=>g[1]);
  if(straight&&flush) return {cat:8,tie:[sHigh]};
  if(counts[0]===4)   return {cat:7,tie:[byC[0],byC[1]]};
  if(counts[0]===3&&counts[1]===2) return {cat:6,tie:[byC[0],byC[1]]};
  if(flush)           return {cat:5,tie:ranks};
  if(straight)        return {cat:4,tie:[sHigh]};
  if(counts[0]===3)   return {cat:3,tie:[byC[0],byC[1],byC[2]]};
  if(counts[0]===2&&counts[1]===2) return {cat:2,tie:[byC[0],byC[1],byC[2]]};
  if(counts[0]===2)   return {cat:1,tie:[byC[0],byC[1],byC[2],byC[3]]};
  return {cat:0,tie:ranks};
}
function cmp5(a,b){ if(a.cat!==b.cat)return a.cat-b.cat; const n=Math.max(a.tie.length,b.tie.length); for(let i=0;i<n;i++){const x=a.tie[i]||0,y=b.tie[i]||0; if(x!==y)return x-y;} return 0; }
function evalBest(cards){
  const n=cards.length; let best=null;
  for(let i=0;i<n-4;i++)for(let j=i+1;j<n-3;j++)for(let k=j+1;k<n-2;k++)for(let l=k+1;l<n-1;l++)for(let m=l+1;m<n;m++){
    const r=rank5([cards[i],cards[j],cards[k],cards[l],cards[m]]);
    if(!best||cmp5(r,best)>0) best=r;
  }
  best.name=CAT5NAME[best.cat]; best.royal=(best.cat===8&&best.tie[0]===14);
  return best;
}
function twoLabel(cards){ const r=cards.map(c=>c.r).sort((a,b)=>b-a); return r[0]===r[1]?`Pair of ${rankStr(r[0])}s`:`${rankStr(r[0])} high`; }
function handLabel(cards){
  if(cards.length<5) return twoLabel(cards);
  const h=evalBest(cards);
  if(h.royal) return "Royal flush";
  if(h.cat===0) return `${rankStr(h.tie[0])} high`;
  if(h.cat===1) return `Pair of ${rankStr(h.tie[0])}s`;
  return h.name;
}
function fmtOdds(m){ return m===1.5?"3:2":m===1?"1:1":`${m}:1`; }

/* ============================================================ FLOW */
function newSession(){
  U={ phase:"bet", deck:[], hole:[], dealer:[], board:[], boardShown:0, dealerShown:false,
      ante:10, blind:10, trips:0, play:0, bankroll:START_BANK, bought:START_BANK, result:null };
  toBet("Set your Ante (Blind matches it) and an optional Trips bet, then Deal.");
}
function toBet(msg){
  U.phase="bet"; U.hole=[]; U.dealer=[]; U.board=[]; U.boardShown=0; U.dealerShown=false; U.play=0; U.result=null;
  const capA=Math.max(0, Math.floor((U.bankroll/3)/MINBET)*MINBET);   // reserve Ante+Blind + one 1x Play
  if(U.ante>capA) U.ante=capA;
  if(3*U.ante+U.trips>U.bankroll) U.trips=Math.max(0, U.bankroll-3*U.ante);
  U.blind=U.ante;
  setStatus(msg||"Place your bets, then Deal.");
  render();
}
function stepAnte(d){
  const cap=Math.min(MAXBET, Math.max(MINBET, Math.floor(((U.bankroll-U.trips)/3)/MINBET)*MINBET));
  U.ante=Math.max(MINBET, Math.min(cap, U.ante+d*MINBET)); U.blind=U.ante;
  if(3*U.ante+U.trips>U.bankroll) U.trips=Math.max(0,U.bankroll-3*U.ante);
  render();
}
function stepTrips(d){ const max=Math.min(MAXBET, U.bankroll-3*U.ante); U.trips=Math.max(0, Math.min(max, U.trips+d*MINBET)); render(); }

function deal(){
  if(U.phase!=="bet") return;
  if(U.ante<MINBET || 3*U.ante+U.trips>U.bankroll) return;
  U.blind=U.ante;
  U.bankroll -= (U.ante+U.blind+U.trips);
  U.deck=shuffle(makeDeck());
  U.hole=[U.deck.pop(),U.deck.pop()];
  U.dealer=[U.deck.pop(),U.deck.pop()];
  U.board=[U.deck.pop(),U.deck.pop(),U.deck.pop(),U.deck.pop(),U.deck.pop()];
  U.boardShown=0; U.dealerShown=false; U.play=0; U.phase="preflop";
  setStatus("Your hole cards. Bet 4×, 3×, or check.");
  render();
}
function betPlay(mult){
  if(U.phase==="bet"||U.phase==="result"||U.phase==="bust") return;
  const amt=mult*U.ante;
  if(amt>U.bankroll) return;
  U.bankroll-=amt; U.play=amt;
  resolve(false);
}
function checkPre(){ if(U.phase!=="preflop")return; U.boardShown=3; U.phase="flop"; setStatus("Flop. Bet 2× or check."); render(); }
function checkFlop(){ if(U.phase!=="flop")return; U.boardShown=5; U.phase="river"; setStatus("Turn & river. Bet 1× or fold."); render(); }
function foldU(){ if(U.phase!=="river")return; U.boardShown=5; resolve(true); }

function resolve(folded){
  U.boardShown=5; U.dealerShown=true; U.phase="result";
  const p=evalBest([...U.hole,...U.board]);
  const d=evalBest([...U.dealer,...U.board]);
  const R={folded,p,d,notes:[],anteRet:0,blindRet:0,playRet:0,tripsRet:0,pWin:false,dWin:false};
  U.result=R;

  // Trips side bet — resolved on your 5-card hand regardless of fold/dealer
  if(U.trips>0){
    if(p.cat>=3){ const m=p.royal?TRIPS_ROYAL:TRIPS[p.cat]; R.tripsRet=U.trips*(1+m); R.notes.push({t:"win",s:`Trips: ${p.royal?'Royal flush':p.name} pays ${m}:1 (+${U.trips*m}).`}); }
    else { R.notes.push({t:"lose",s:`Trips loses — ${p.name} (need trips or better) (−${U.trips}).`}); }
  }
  if(folded){
    R.outcome="fold";
    R.notes.push({t:"lose",s:`Folded — Ante and Blind lost (−${U.ante+U.blind}).`});
    finishU(); return;
  }

  const c=cmp5(p,d);
  const q=d.cat>=1;   // dealer qualifies with a pair or better
  R.pWin=c>0; R.dWin=c<0;
  // Play bet (always in action)
  R.playRet = c>0 ? U.play*2 : c<0 ? 0 : U.play;
  // Ante bet
  if(!q){ R.anteRet=U.ante; R.notes.push({t:"",s:`Dealer doesn't qualify (${d.name}) — Ante pushes.`}); }
  else { R.anteRet = c>0 ? U.ante*2 : c<0 ? 0 : U.ante; }
  // Blind bet — only pays on a win, and only a straight+ pays odds (else push)
  if(c>0){
    if(p.cat>=4){ const m=p.royal?BLIND_ROYAL:BLIND[p.cat]; R.blindRet=Math.round(U.blind*(1+m)); R.notes.push({t:"win",s:`Blind: ${p.royal?'Royal flush':p.name} pays ${fmtOdds(m)} (+${Math.round(U.blind*m)}).`}); }
    else { R.blindRet=U.blind; }
  } else if(c===0){ R.blindRet=U.blind; }
  else { R.blindRet=0; }

  if(c>0){ R.outcome="win"; R.notes.unshift({t:"win",s:`You win — ${p.name} beats ${d.name}.`}); }
  else if(c<0){ R.outcome="lose"; R.notes.unshift({t:"lose",s:`Dealer wins — ${d.name} beats ${p.name}.`}); }
  else { R.outcome="push"; R.notes.unshift({t:"",s:`Tie — ${p.name}. Ante, Blind & Play push.`}); }
  finishU();
}
function finishU(){
  const R=U.result;
  const ret=(R.anteRet||0)+(R.blindRet||0)+(R.playRet||0)+(R.tripsRet||0);
  U.bankroll+=ret;
  const staked=U.ante+U.blind+U.trips+(R.folded?0:U.play);
  R.delta=ret-staked;
  setStatus(R.outcome==="win"?"You win the hand! 🎉":R.outcome==="lose"?"Dealer takes it.":R.outcome==="push"?"Push — bets returned.":"Hand over.");
  render();
}
function nextHand(){ if(U.bankroll<3*MINBET){ toBust(); return; } toBet("Place your bets for the next hand."); }
function rebuy(){ U.bankroll+=START_BANK; U.bought+=START_BANK; toBet(`Re-bought ${START_BANK} chips. Good luck!`); }
function toBust(){ U.phase="bust"; setStatus("Out of chips."); render(); }

/* ============================================================ RENDER */
function setStatus(m){ const s=document.getElementById("status"); if(s)s.textContent=m; }
function wagChip(label,amt,on){ return `<span class="wag ${on?'':'off'}">${label} <b>${amt||0}</b></span>`; }
function render(){
  if(!U) return;
  const net=U.bankroll-U.bought;
  document.getElementById("chipbar").innerHTML =
    `<span class="chips">💰 ${U.bankroll} chips</span><span class="net ${net>0?'up':net<0?'down':''}">Session: ${net>=0?'+':''}${net}</span>`;
  const playing = U.phase!=="bet" && U.phase!=="bust";
  document.getElementById("wagers").innerHTML = playing
    ? wagChip("Ante",U.ante,true)+wagChip("Blind",U.blind,true)+wagChip("Trips",U.trips,U.trips>0)+wagChip("Play",U.play,U.play>0)
    : "";

  // dealer
  const dr=document.getElementById("dealerRow"); dr.innerHTML=""; const dn=document.getElementById("dealerName");
  if(!U.dealer.length){ dr.appendChild(cardEl(null,{slot:true})); dr.appendChild(cardEl(null,{slot:true})); dn.textContent=""; }
  else if(!U.dealerShown){ dr.appendChild(cardEl(null,{back:true})); dr.appendChild(cardEl(null,{back:true})); dn.textContent="…"; }
  else { const dh=evalBest([...U.dealer,...U.board]); U.dealer.forEach(c=>dr.appendChild(cardEl(c,{cls:U.result&&U.result.dWin?"win":""}))); dn.innerHTML=`${handLabel([...U.dealer,...U.board])} · ${dh.cat>=1?'<span style="color:#8ff0a8">qualifies</span>':'<span style="color:#ff9a9a">no qualify</span>'}`; }

  // board
  const br=document.getElementById("boardRow"); br.innerHTML="";
  for(let i=0;i<5;i++){
    if(!U.board.length) br.appendChild(cardEl(null,{slot:true}));
    else if(i<U.boardShown) br.appendChild(cardEl(U.board[i]));
    else br.appendChild(cardEl(null,{back:true}));
  }

  // hole
  const hr=document.getElementById("holeRow"); hr.innerHTML=""; const hn=document.getElementById("holeName");
  if(!U.hole.length){ hr.appendChild(cardEl(null,{slot:true})); hr.appendChild(cardEl(null,{slot:true})); hn.textContent=""; }
  else {
    U.hole.forEach(c=>hr.appendChild(cardEl(c,{cls:U.result&&U.result.pWin?"win":""})));
    const shown=[...U.hole,...U.board.slice(0,U.boardShown)];
    hn.textContent = handLabel(shown);
  }

  // bets + controls
  const bets=document.getElementById("bets"), ctr=document.getElementById("controls");
  bets.innerHTML=""; ctr.innerHTML="";
  const mkBtn=(txt,cls,fn,dis)=>{ const b=document.createElement("button"); b.className="btn "+cls; b.textContent=txt; b.disabled=!!dis; b.onclick=fn; return b; };

  if(U.phase==="bet"){
    const capT=Math.min(MAXBET, U.bankroll-3*U.ante);
    bets.innerHTML=`<div class="betbox">
      <div class="betlabel">Ante & Blind — <b>${U.ante}</b> each</div>
      <div class="stepper"><button onclick="stepAnte(-1)" ${U.ante<=MINBET?'disabled':''}>–</button><div class="val">${U.ante}</div><button onclick="stepAnte(1)" ${U.ante>=MAXBET||3*(U.ante+MINBET)+U.trips>U.bankroll?'disabled':''}>+</button></div>
      <div class="betlabel">Trips <b>${U.trips||'—'}</b> <span class="muted">(optional side bet)</span></div>
      <div class="stepper"><button onclick="stepTrips(-1)" ${U.trips<=0?'disabled':''}>–</button><div class="val">${U.trips}</div><button onclick="stepTrips(1)" ${U.trips>=capT?'disabled':''}>+</button></div>
    </div>`;
    ctr.appendChild(mkBtn(`Deal ▶  (in ${U.ante+U.blind+U.trips})`,"",deal, U.ante<MINBET||3*U.ante+U.trips>U.bankroll));
  } else if(U.phase==="preflop"){
    ctr.appendChild(mkBtn(`Bet 4× (${4*U.ante})`,"play",()=>betPlay(4), 4*U.ante>U.bankroll));
    ctr.appendChild(mkBtn(`Bet 3× (${3*U.ante})`,"play",()=>betPlay(3), 3*U.ante>U.bankroll));
    ctr.appendChild(mkBtn("Check","check",checkPre));
  } else if(U.phase==="flop"){
    ctr.appendChild(mkBtn(`Bet 2× (${2*U.ante})`,"play",()=>betPlay(2), 2*U.ante>U.bankroll));
    ctr.appendChild(mkBtn("Check","check",checkFlop));
  } else if(U.phase==="river"){
    ctr.appendChild(mkBtn(`Bet 1× (${U.ante})`,"play",()=>betPlay(1), U.ante>U.bankroll));
    ctr.appendChild(mkBtn("Fold","fold",foldU));
  } else if(U.phase==="result"){
    const R=U.result;
    const big=document.createElement("div"); big.className="bigresult "+(R.delta>0?"win":R.delta<0?"lose":"push");
    big.textContent = R.delta>0?`+${R.delta} chips`:R.delta<0?`${R.delta} chips`:"Even (push)";
    bets.appendChild(big);
    const nextRow=document.createElement("div"); nextRow.className="controls"; nextRow.style.marginTop="8px";
    nextRow.appendChild(mkBtn("Next hand ▶","",nextHand));
    bets.appendChild(nextRow);
    const nd=document.createElement("div"); nd.className="notes";
    R.notes.forEach(n=>{ const el=document.createElement("div"); el.className="note "+(n.t||""); el.textContent=n.s; nd.appendChild(el); });
    bets.appendChild(nd);
  } else if(U.phase==="bust"){
    bets.innerHTML=`<div class="note lose" style="text-align:center">Out of chips. Re-buy to keep playing.</div>`;
    ctr.appendChild(mkBtn(`Re-buy (+${START_BANK})`,"",rebuy));
  }
  updateTipVisibility();
}

/* ============================================================ TIPS */
const TIPS={
  beginner:[
    "Post an <b>Ante</b> and equal <b>Blind</b>, then make ONE <b>Play</b> bet whenever you like — earlier bets are bigger: 4× before any board cards, 2× after the flop, 1× at the end.",
    "You can only fold at the very end. If you like your hole cards, betting 4× early is the whole edge of the game.",
    "The dealer needs a <b>pair or better</b> to qualify. If the dealer doesn't qualify, your Ante just pushes (Play still plays).",
    "The <b>Blind</b> pays a bonus when you win with a straight or better — up to 500:1 for a royal. <b>Trips</b> is a side bet that pays on trips+ no matter what the dealer has."
  ],
  advanced:[
    "Pre-flop, bet <b>4×</b> with any pair of 3s+, any ace, any K, Q-8 or better, and J-10. Otherwise check.",
    "On the flop, bet <b>2×</b> if you have a pair or better (using a hole card), or a strong flush/straight draw with over-cards.",
    "At the river, bet <b>1×</b> unless you truly can't beat the board — fold only when you have nothing that plays. Folding is rare.",
    "Because a checked hand can still bet 1× at the end, you almost never fold a made pair. The mistake that costs the most is checking a 4× hand pre-flop."
  ]
};
function liveHint(){
  if(!U) return "";
  if(U.phase==="preflop"){
    const r=U.hole.map(c=>c.r).sort((a,b)=>b-a); const pair=r[0]===r[1];
    const rec = pair || r[0]===14 || r[0]===13 || (r[0]===12&&r[1]>=8) || (r[0]===11&&r[1]>=10);
    return `Hole cards <b>${handLabel(U.hole)}</b> — rule of thumb: <b>${rec?'bet 4×':'check'}</b>.`;
  }
  if(U.phase==="flop"){ const h=evalBest([...U.hole,...U.board.slice(0,3)]); return `You have <b>${handLabel([...U.hole,...U.board.slice(0,3)])}</b> — rule of thumb: <b>${h.cat>=1?'bet 2×':'check'}</b>.`; }
  if(U.phase==="river"){ const h=evalBest([...U.hole,...U.board]); return `You have <b>${handLabel([...U.hole,...U.board])}</b> — rule of thumb: <b>${h.cat>=1?'bet 1×':'likely fold'}</b>.`; }
  return "";
}
function openTips(){
  const lvl=settings.tipLevel;
  let html=`<button class="btn sec sm close" onclick="closeOverlay()">✕</button><h2>💡 Tips</h2>
    <div class="tiprow"><div class="switch"><button class="toggle ${settings.tipsOn?'on':''}" onclick="toggleTips()"></button><span>Tips ${settings.tipsOn?'ON':'OFF'}</span></div>
    <div class="seg" style="opacity:${settings.tipsOn?1:.4};"><button class="${lvl==='beginner'?'on':''}" ${settings.tipsOn?'':'disabled'} onclick="setTipLevel('beginner')">Beginner</button><button class="${lvl==='advanced'?'on':''}" ${settings.tipsOn?'':'disabled'} onclick="setTipLevel('advanced')">Advanced</button></div></div>`;
  const hint=liveHint(); if(hint) html+=`<h3>This hand</h3><div class="tip-block">${hint}</div>`;
  html+=`<h3>${lvl==='advanced'?'Strategy':'Basics'}</h3>`;
  TIPS[lvl].forEach(t=>html+=`<div class="tip-block">${t}</div>`);
  openPanel(html,"tips");
}
function setTipLevel(l){ settings.tipLevel=l; openTips(); }
function toggleTips(){ settings.tipsOn=!settings.tipsOn; updateTipVisibility(); openTips(); }
function updateTipVisibility(){ const f=document.getElementById("floatTip"); if(f) f.style.display=settings.tipsOn?"block":"none"; }

/* ============================================================ OVERLAYS */
function openPanel(html,kind){ document.getElementById("panel").innerHTML=html; document.getElementById("overlay").classList.add("show"); curOverlay={kind}; }
function closeOverlay(){ document.getElementById("overlay").classList.remove("show"); curOverlay={kind:null}; }

function openRules(back){
  const closeBtn = back ? `<button class="btn sec sm close" onclick="${back}()">‹ Back</button>` : `<button class="btn sec sm close" onclick="closeOverlay()">✕</button>`;
  const html=`${closeBtn}
    <h2>How to Play Ultimate Texas Hold'em</h2>
    <p>Heads-up against the dealer. You each get two hole cards and share five community cards; best five-card poker hand wins.</p>
    <h3>The bets</h3>
    <p>Post an <b>Ante</b> and an equal <b>Blind</b> to be dealt in (plus an optional <b>Trips</b> side bet). You make exactly one <b>Play</b> bet, and the earlier you commit, the bigger it must be:</p>
    <ul>
      <li>After your two hole cards: bet <b>4×</b> or <b>3×</b> your ante, or check.</li>
      <li>After the flop (3 cards): bet <b>2×</b>, or check.</li>
      <li>After the turn &amp; river (last 2 cards): bet <b>1×</b>, or <b>fold</b> (losing Ante + Blind).</li>
    </ul>
    <h3>Showdown</h3>
    <p>The dealer needs a <b>pair or better</b> to qualify.</p>
    <ul>
      <li><b>Play</b> pays 1:1 if you beat the dealer (win/lose/push regardless of qualifying).</li>
      <li><b>Ante</b> pays 1:1 if you win — but <b>pushes</b> if the dealer doesn't qualify.</li>
      <li><b>Blind</b> only wins if you beat the dealer, and pays a bonus only on a straight or better (otherwise it pushes).</li>
    </ul>
    <h3>Blind pay table</h3>
    <table><tr><td>Straight</td><td>1 : 1</td></tr><tr><td>Flush</td><td>3 : 2</td></tr><tr><td>Full house</td><td>3 : 1</td></tr><tr><td>Four of a kind</td><td>10 : 1</td></tr><tr><td>Straight flush</td><td>50 : 1</td></tr><tr><td>Royal flush</td><td>500 : 1</td></tr></table>
    <h3>Trips pay table</h3>
    <table><tr><td>Three of a kind</td><td>3 : 1</td></tr><tr><td>Straight</td><td>4 : 1</td></tr><tr><td>Flush</td><td>7 : 1</td></tr><tr><td>Full house</td><td>8 : 1</td></tr><tr><td>Four of a kind</td><td>30 : 1</td></tr><tr><td>Straight flush</td><td>40 : 1</td></tr><tr><td>Royal flush</td><td>50 : 1</td></tr></table>`;
  openPanel(html,"rules");
}

function openMenu(){
  const html=`<button class="btn sec sm close" onclick="closeOverlay()">✕</button><h2>⚙ Menu</h2>
    <h3>Your name</h3>
    <input class="txtinp" value="${settings.playerName==='You'?'':settings.playerName}" maxlength="16" autocomplete="off" oninput="onNameInput(this.value)" placeholder="You">
    <h3>Learning tips</h3>
    <div class="tiprow"><div class="switch"><button class="toggle ${settings.tipsOn?'on':''}" onclick="menuToggleTips()"></button><span>Tips ${settings.tipsOn?'ON':'OFF'}</span></div>
    <div class="seg" style="opacity:${settings.tipsOn?1:.4};"><button class="${settings.tipLevel==='beginner'?'on':''}" ${settings.tipsOn?'':'disabled'} onclick="settings.tipLevel='beginner';openMenu();">Beginner</button><button class="${settings.tipLevel==='advanced'?'on':''}" ${settings.tipsOn?'':'disabled'} onclick="settings.tipLevel='advanced';openMenu();">Advanced</button></div></div>
    <h3>Deck</h3>
    <div class="switch" style="display:flex;"><button class="toggle ${settings.fourColor?'on':''}" onclick="menuToggleFour()"></button><span>Four-color deck (♠ black · ♥ red · ♦ blue · ♣ green)</span></div>
    <div class="switch" style="display:flex;margin-top:8px;"><button class="toggle ${settings.speed?'on':''}" onclick="menuToggleSpeed()"></button><span>Speed play (fewer taps)</span></div>
    <h3>Table</h3>
    <a class="setup-opt" href="../">🏠 Back to all games</a>
    <button class="setup-opt" onclick="closeOverlay();chooseSetup();">↩ New session / reset chips</button>
    <button class="setup-opt" onclick="openRules()">📖 How to play</button>
    <div style="text-align:center;margin-top:8px;"><button class="btn sec" onclick="closeOverlay()">Resume</button></div>`;
  openPanel(html,"menu");
}
function onNameInput(v){ settings.playerName=(v||"").trim().slice(0,16)||"You"; }
function menuToggleTips(){ settings.tipsOn=!settings.tipsOn; updateTipVisibility(); openMenu(); }
function menuToggleFour(){ settings.fourColor=!settings.fourColor; if(U)render(); openMenu(); }
function menuToggleSpeed(){ settings.speed=!settings.speed; openMenu(); }

/* ============================================================ SETUP */
function chooseSetup(){
  const html=`<button class="btn sec sm close" onclick="exitSetup()">✕</button>
    <h2>♠ Ultimate Texas Hold'em ♥</h2>
    <p>Take on the dealer with two hole cards and five community cards. Bet big early when you like your hand.</p>
    <div style="margin:8px 0;"><button class="btn sec sm" onclick="openRules('chooseSetup')">📖 How to play</button></div>
    <h3>Your name</h3>
    <input class="txtinp" value="${settings.playerName==='You'?'':settings.playerName}" maxlength="16" autocomplete="off" oninput="onNameInput(this.value)" placeholder="You">
    <h3>Tips</h3>
    <div class="tiprow"><div class="switch"><button class="toggle ${settings.tipsOn?'on':''}" onclick="toggleTipsSetup(this)"></button><span id="tipTxt">${settings.tipsOn?'Tips ON':'Tips OFF'}</span></div>
    <div class="seg" id="setupSeg" style="opacity:${settings.tipsOn?1:.4};"><button class="${settings.tipLevel==='beginner'?'on':''}" id="s-b" ${settings.tipsOn?'':'disabled'} onclick="settings.tipLevel='beginner';refreshLvl()">Beginner</button><button class="${settings.tipLevel==='advanced'?'on':''}" id="s-a" ${settings.tipsOn?'':'disabled'} onclick="settings.tipLevel='advanced';refreshLvl()">Advanced</button></div></div>
    <h3>Deck</h3>
    <div class="switch" style="display:flex;"><button class="toggle ${settings.fourColor?'on':''}" onclick="settings.fourColor=!settings.fourColor;this.classList.toggle('on',settings.fourColor);"></button><span>Four-color deck</span></div>
    <div class="switch" style="display:flex;margin-top:8px;"><button class="toggle ${settings.speed?'on':''}" onclick="settings.speed=!settings.speed;this.classList.toggle('on',settings.speed);"></button><span>Speed play (fewer taps)</span></div>
    <p class="muted" style="margin-top:12px;">You'll start with ${START_BANK} chips.</p>
    <div style="text-align:center;margin-top:10px;"><button class="btn" onclick="closeOverlay();newSession();">Sit down ▶</button></div>`;
  openPanel(html,"setup");
}
function toggleTipsSetup(el){ settings.tipsOn=!settings.tipsOn; updateTipVisibility(); chooseSetup(); }
function refreshLvl(){ document.getElementById("s-b").classList.toggle("on",settings.tipLevel==='beginner'); document.getElementById("s-a").classList.toggle("on",settings.tipLevel==='advanced'); }

/* wire up */
document.getElementById("tipBtn").onclick=openTips;
document.getElementById("menuBtn").onclick=openMenu;
document.getElementById("rulesBtn").onclick=()=>openRules();
document.getElementById("overlay").onclick=e=>{ if(e.target.id!=="overlay")return; if(curOverlay.kind==="tips"||curOverlay.kind==="menu"||curOverlay.kind==="rules") closeOverlay(); else if(curOverlay.kind==="setup" && U) closeOverlay(); };
function exitSetup(){ if(U) closeOverlay(); else location.href="../"; }
document.addEventListener("keydown",function(e){ if(e.key==="Escape" && document.getElementById("overlay").classList.contains("show")){ if(curOverlay.kind==="setup"||curOverlay.kind==="boot") exitSetup(); else closeOverlay(); } });
updateTipVisibility();
chooseSetup();
</script>
