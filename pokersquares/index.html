<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Poker Squares</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#0d5c3f">
<link rel="apple-touch-icon" href="../icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root{ --felt:#0d5c3f; --felt2:#0a4a33; --wood:#8a5a2b; --wood2:#6b4420;
    --gold:#f0c674; --cream:#f7f3e8; --ink:#1c2a24; --red:#c22; --green:#178a3a; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(circle at 50% 12%, var(--felt) 0%, var(--felt2) 70%, #063324 100%);
    color:var(--cream); min-height:100vh; overflow-x:hidden; display:flex; flex-direction:column; align-items:center;}
  .wrap{width:100%; max-width:520px; padding:8px 12px 44px; position:relative;}
  header{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:4px;}
  h1{font-size:19px; margin:0; letter-spacing:1px; color:var(--gold); text-shadow:0 1px 2px rgba(0,0,0,.5);}
  h1 small{display:block; font-size:10px; letter-spacing:2px; opacity:.7; font-weight:600;}
  .top-btns{display:flex; gap:6px;}
  button{font-family:inherit; cursor:pointer; border:none; border-radius:10px; font-weight:600; transition:transform .06s, filter .15s;}
  button:active{transform:translateY(1px) scale(.98);}
  .btn{background:var(--gold); color:var(--ink); padding:9px 14px; font-size:14px; box-shadow:0 2px 5px rgba(0,0,0,.35);}
  .btn.sec{background:rgba(255,255,255,.14); color:var(--cream);} .btn.sm{padding:6px 10px; font-size:12px;}
  .btn:disabled{opacity:.4; cursor:default;}
  a.btn{text-decoration:none; display:inline-block;}

  /* ---- to-place tray ---- */
  .pstray{display:flex; align-items:center; gap:12px; justify-content:center;
    background:linear-gradient(180deg,var(--wood),var(--wood2)); border-radius:12px; padding:10px 12px; margin:6px 0 10px;
    box-shadow:inset 0 2px 6px rgba(0,0,0,.3),0 3px 8px rgba(0,0,0,.4);}
  .pstray #psCurrent{flex:0 0 auto;}
  .pstray-info{flex:1 1 auto; text-align:center; color:#2b1a08; font-weight:800; min-width:0;}
  .pstray-place{font-size:14px;} .pstray-prog{font-size:12px; opacity:.85; margin-top:2px;}
  .pstray-score{flex:0 0 auto; text-align:center; color:#2b1a08;}
  .pstray-score .lbl{font-size:10px; letter-spacing:1px; opacity:.8;}
  .pstray-score .num{font-size:26px; font-weight:900; line-height:1;}
  .pstray-score .best{font-size:11px; opacity:.85; margin-top:2px; white-space:nowrap;}

  /* ---- cards ---- */
  .card{width:52px; height:74px; border-radius:8px; background:var(--cream); color:var(--ink); position:relative;
    box-shadow:0 2px 5px rgba(0,0,0,.4); flex:0 0 auto; user-select:none; border:1px solid #d8d2c0;}
  .card .rank{position:absolute; top:4px; left:6px; font-size:15px; font-weight:800; line-height:1;}
  .card .rankb{position:absolute; bottom:4px; right:6px; font-size:15px; font-weight:800; line-height:1; transform:rotate(180deg);}
  .card .pip{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:26px;}
  .card.back{background:repeating-linear-gradient(45deg,#1b6fb3,#1b6fb3 7px,#155a94 7px,#155a94 14px); border:2px solid #0e3f6b;}

  /* ---- 5x5 board + row/col score chips ---- */
  .psboard{display:grid; grid-template-columns:repeat(5,1fr) minmax(30px,auto); gap:5px; width:100%; max-width:440px; margin:0 auto;}
  .pscell{position:relative; height:clamp(50px,14.5vw,66px); border-radius:7px; display:flex; align-items:center; justify-content:center; overflow:hidden;}
  .pscell.empty{background:rgba(0,0,0,.18); border:1.5px dashed rgba(247,243,232,.3);}
  .pscell.empty.live{border-color:var(--gold); background:rgba(240,198,116,.10); cursor:pointer;}
  .pscell.filled{background:var(--cream); box-shadow:0 1px 3px rgba(0,0,0,.4); border:1px solid #d8d2c0;}
  .pscell.just{animation:pop .18s ease-out;}
  @keyframes pop{from{transform:scale(.82);}to{transform:scale(1);}}
  .psmini{font-weight:800; line-height:1; text-align:center; display:flex; flex-direction:column; align-items:center;}
  .psmini .r{font-size:clamp(13px,4.1vw,18px);}
  .psmini .s{font-size:clamp(15px,4.6vw,20px); margin-top:1px;}
  .psscore{display:flex; flex-direction:column; align-items:center; justify-content:center; padding:2px; color:var(--gold); font-weight:800; min-height:34px;}
  .psscore .ab{font-size:9px; letter-spacing:.5px; opacity:.85;}
  .psscore .pts{font-size:13px; color:var(--cream);}
  .psscore.has{filter:drop-shadow(0 0 4px rgba(240,198,116,.5));}
  .psscore.has .pts{color:var(--gold);}
  .psscore .dot{opacity:.4; font-size:14px;}
  .psscore.corner{background:var(--gold); color:var(--ink); border-radius:8px;}
  .psscore.corner .ab{opacity:.7; color:var(--ink);} .psscore.corner .pts{color:var(--ink); font-size:15px;}

  .controls{display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin-top:14px;}
  .tip-block{background:rgba(0,0,0,.22); border-left:3px solid var(--gold); border-radius:8px; padding:8px 12px; margin:8px auto; font-size:13px; line-height:1.5; max-width:440px;}
  .tip-block b{color:var(--gold);}

  /* ---- overlay / panel / controls (shared conventions) ---- */
  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.62); display:none; align-items:center; justify-content:center; z-index:50; padding:16px;}
  .overlay.show{display:flex;}
  .panel{background:linear-gradient(180deg,#12503a,#0c3d2c); border:2px solid var(--gold); border-radius:16px;
    max-width:520px; width:100%; max-height:88vh; overflow-y:auto; padding:18px; box-shadow:0 10px 40px rgba(0,0,0,.6);}
  .panel h2{margin:0 0 6px; color:var(--gold); font-size:20px;} .panel h3{color:var(--gold); font-size:15px; margin:14px 0 6px;}
  .panel p,.panel li{font-size:14px; line-height:1.5;} .panel ul{margin:4px 0 4px 2px; padding-left:20px;}
  .panel table{width:100%; border-collapse:collapse; font-size:13px; margin:4px 0;}
  .panel td{padding:3px 6px; border-bottom:1px solid rgba(255,255,255,.12);} .panel td:last-child{text-align:right; color:var(--gold); font-weight:700;}
  .panel tr.hi td{color:#fff;} .panel tr.hi td:last-child{color:var(--gold);}
  .panel .close{position:sticky; top:0; float:right;}
  .switch{display:flex; align-items:center; gap:8px; font-size:13px;}
  .seg{display:inline-flex; vertical-align:middle; background:rgba(0,0,0,.3); border-radius:20px; padding:3px; gap:3px;}
  .seg button{background:transparent; color:var(--cream); padding:6px 14px; font-size:13px; border-radius:16px;}
  .seg button.on{background:var(--gold); color:var(--ink);}
  .toggle{width:44px; height:24px; border-radius:14px; background:rgba(0,0,0,.4); position:relative; padding:0; flex:0 0 auto;}
  .toggle::after{content:""; position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:var(--cream); transition:left .18s;}
  .toggle.on{background:var(--gold);} .toggle.on::after{left:22px;}
  .setup-opt{display:block; width:100%; text-align:left; background:rgba(255,255,255,.1); color:var(--cream); padding:13px 14px; border-radius:10px; margin:7px 0; font-size:15px; text-decoration:none;}
  .scorecard{display:grid; grid-template-columns:1fr auto; gap:2px 10px; font-size:13px; margin:6px 0;}
  .scorecard .h{color:var(--gold); font-weight:700;}
  .scorecard .p{text-align:right; color:var(--gold); font-weight:700;}
  .muted{opacity:.75; font-size:12px;}
  @media(max-width:360px){ .pstray-score .num{font-size:22px;} h1{font-size:17px;} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎴 POKER SQUARES <small>SOLITAIRE · 5×5 GRID</small></h1>
    <div class="top-btns">
      <a class="btn sec sm" href="../" title="All games">🏠</a>
      <button class="btn sec sm" id="rulesBtn">Rules</button>
      <button class="btn sec sm" id="menuBtn">Menu</button>
    </div>
  </header>

  <div class="pstray">
    <div id="psCurrent"></div>
    <div class="pstray-info">
      <div class="pstray-place" id="psPlace">Tap an empty square</div>
      <div class="pstray-prog" id="psProg">Card 1 of 25</div>
    </div>
    <div class="pstray-score">
      <div class="lbl">SCORE</div><div class="num" id="psTotal">0</div>
      <div class="best" id="psBest">Best 0</div>
    </div>
  </div>

  <div class="psboard" id="psboard"></div>

  <div id="psTips"></div>

  <div class="controls">
    <button class="btn sec sm" id="psUndo">↩ Undo</button>
    <button class="btn sm" id="psNew">🔀 New game</button>
  </div>
</div>

<div class="overlay" id="overlay"><div class="panel" id="panel"></div></div>

<script src="../sfx.js"></script>
<script>
/* ============================================================
   POKER SQUARES (a.k.a. Poker Solitaire / Poker Patience)
   Deal 25 cards one at a time into a 5x5 grid. Once a card is
   placed it can't be moved (Undo reverses your last placement
   only). When all 25 are down, each of the 5 rows and 5 columns
   scores as a poker hand; the total is the sum. Beat your best.
   ============================================================ */
const SUITS=["♠","♥","♦","♣"], SUIT_RED=[false,true,true,false];
const RSTR={11:"J",12:"Q",13:"K",14:"A"};
const FOURCOL=["#1c2a24","#c22","#1b6fb3","#178a3a"];   // ♠ black · ♥ red · ♦ blue · ♣ green

const NAMEOF={royal:"Royal flush",sflush:"Straight flush",four:"Four of a kind",full:"Full house",
  flush:"Flush",straight:"Straight",three:"Three of a kind",twopair:"Two pair",pair:"One pair",high:"High card"};
const ABBR={royal:"RF",sflush:"SF",four:"4K",full:"FH",flush:"FL",straight:"ST",three:"3K",twopair:"2P",pair:"1P",high:"—"};
const ORDER=["royal","sflush","four","full","flush","straight","three","twopair","pair","high"];
const SCORING={
  american:{royal:100,sflush:75,four:50,full:25,flush:20,straight:15,three:10,twopair:5,pair:2,high:0},
  english :{royal:30, sflush:30,four:16,full:10,flush:5, straight:12,three:6, twopair:3,pair:1,high:0}
};

const LS_KEY="pokersquares.v1";
let settings={tipsOn:false, fourColor:true, scoring:"american"};
let best=0;
try{ const raw=localStorage.getItem(LS_KEY); if(raw){ const o=JSON.parse(raw);
  if(o&&o.settings) Object.assign(settings,o.settings); if(o&&typeof o.best==="number") best=o.best; } }catch(e){}
function persist(){ try{ localStorage.setItem(LS_KEY, JSON.stringify({settings,best})); }catch(e){} }

/* ---- state ---- */
let grid=new Array(25).fill(null);
let queue=[];              // remaining deck (draw from end)
let current=null;          // card awaiting placement
let lastMove=null;         // {i, card} — single-step undo
let over=false;
let curOverlay={kind:null};

function rankStr(r){return RSTR[r]||String(r);}
function suitColor(s){ return settings.fourColor ? FOURCOL[s] : (SUIT_RED[s]?"#c22":"#1c2a24"); }
function makeDeck(){const d=[];for(let s=0;s<4;s++)for(let r=2;r<=14;r++)d.push({r,s});return d;}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ---- hand evaluation (5 cards) ---- */
function scoreHand(cards){
  if(!cards || cards.some(c=>!c)) return null;
  const rs=cards.map(c=>c.r).slice().sort((a,b)=>a-b);
  const ss=cards.map(c=>c.s);
  const flush=ss.every(s=>s===ss[0]);
  const uniq=[...new Set(rs)];
  let straight=false;
  if(uniq.length===5){
    if(rs[4]-rs[0]===4) straight=true;
    else if(rs[0]===2&&rs[1]===3&&rs[2]===4&&rs[3]===5&&rs[4]===14) straight=true; // wheel A-2-3-4-5
  }
  const cnt={}; rs.forEach(r=>cnt[r]=(cnt[r]||0)+1);
  const counts=Object.values(cnt).sort((a,b)=>b-a);
  let key;
  if(straight&&flush&&rs[0]===10&&rs[4]===14) key="royal";
  else if(straight&&flush) key="sflush";
  else if(counts[0]===4) key="four";
  else if(counts[0]===3&&counts[1]===2) key="full";
  else if(flush) key="flush";
  else if(straight) key="straight";
  else if(counts[0]===3) key="three";
  else if(counts[0]===2&&counts[1]===2) key="twopair";
  else if(counts[0]===2) key="pair";
  else key="high";
  return {key, name:NAMEOF[key], pts:SCORING[settings.scoring][key]};
}
function lineIdx(type,idx){ const a=[]; for(let k=0;k<5;k++) a.push(type==="row"? idx*5+k : k*5+idx); return a; }
function computeLines(){
  const rows=[],cols=[]; let total=0;
  for(let i=0;i<5;i++){ const h=scoreHand(lineIdx("row",i).map(x=>grid[x])); rows.push(h); if(h) total+=h.pts; }
  for(let j=0;j<5;j++){ const h=scoreHand(lineIdx("col",j).map(x=>grid[x])); cols.push(h); if(h) total+=h.pts; }
  return {rows,cols,total};
}

/* ---- flow ---- */
// Sound is best-effort: no sfx.js, no noise, no error.
function sfx(n){ if(window.SFX) SFX.play(n); }
function newGame(){
  sfx('shuffle');
  grid=new Array(25).fill(null);
  queue=shuffle(makeDeck());
  current=queue.pop();
  lastMove=null; over=false;
  render();
}
function placed(){ return grid.reduce((n,c)=>n+(c?1:0),0); }
function place(i){
  if(over||!current||grid[i]) return;
  grid[i]=current;
  sfx('place');
  lastMove={i, card:current, was:i};
  current = queue.length ? queue.pop() : null;
  if(placed()===25){ finish(); } else { render(i); }
}
function undo(){
  if(!lastMove) return;
  sfx('select');
  if(current) queue.push(current);   // send the un-placed next card back
  current=lastMove.card;
  grid[lastMove.i]=null;
  const back=lastMove.i;
  lastMove=null; over=false;
  render(); 
}
function finish(){
  over=true;
  const {total}=computeLines();
  var beatBest = total>best;          // a new personal best gets the bigger fanfare
  if(beatBest){ best=total; }
  sfx(beatBest ? 'win' : 'good');
  persist();
  render();
  openResults(total);
}

/* ---- render ---- */
function bigCardHTML(c){
  if(!c) return '<div class="card back"></div>';
  return '<div class="card" style="color:'+suitColor(c.s)+'"><span class="rank">'+rankStr(c.r)+'</span><span class="pip">'+SUITS[c.s]+'</span><span class="rankb">'+rankStr(c.r)+'</span></div>';
}
function chipHTML(h){
  if(!h) return '<div class="psscore"><span class="dot">·</span></div>';
  return '<div class="psscore '+(h.pts>0?'has':'')+'" title="'+h.name+' · '+h.pts+'"><span class="ab">'+ABBR[h.key]+'</span><span class="pts">'+h.pts+'</span></div>';
}
function render(justIdx){
  const {rows,cols,total}=computeLines();
  // tray
  document.getElementById("psCurrent").innerHTML=bigCardHTML(current);
  const n=placed();
  document.getElementById("psPlace").textContent = over ? "Board complete" : "Tap an empty square";
  document.getElementById("psProg").textContent  = over ? "25 of 25 placed" : ("Card "+(n+1)+" of 25");
  document.getElementById("psTotal").textContent = total;
  document.getElementById("psBest").textContent  = "Best "+best;
  // board (6x6: 25 cells + 5 row chips + 5 col chips + total corner)
  let html="";
  for(let r=0;r<5;r++){
    for(let c=0;c<5;c++){
      const idx=r*5+c, card=grid[idx];
      if(card){
        html+='<div class="pscell filled'+(justIdx===idx?' just':'')+'">'
            +'<span class="psmini" style="color:'+suitColor(card.s)+'"><span class="r">'+rankStr(card.r)+'</span><span class="s">'+SUITS[card.s]+'</span></span></div>';
      }else{
        const live=(!over&&current)?' live':'';
        html+='<div class="pscell empty'+live+'"'+(live?(' onclick="place('+idx+')"'):'')+'></div>';
      }
    }
    html+=chipHTML(rows[r]);
  }
  for(let c=0;c<5;c++) html+=chipHTML(cols[c]);
  html+='<div class="psscore corner"><span class="ab">TOT</span><span class="pts">'+total+'</span></div>';
  document.getElementById("psboard").innerHTML=html;
  // tips
  const fp=SCORING[settings.scoring].flush;
  document.getElementById("psTips").innerHTML = settings.tipsOn
    ? '<div class="tip-block"><b>Flushes are your friend.</b> Funnel one suit down a single row or column — a flush is '+fp+' pts and far easier to land than a straight.</div>'
     +'<div class="tip-block"><b>Every square feeds two hands.</b> A card lives in one row and one column at once, so the corners and centre are worth the most thought.</div>'
    : "";
  // undo availability
  document.getElementById("psUndo").disabled = !lastMove;
}

/* ---- overlays ---- */
function openPanel(html,kind){ document.getElementById("panel").innerHTML=html; document.getElementById("overlay").classList.add("show"); curOverlay={kind}; }
function closeOverlay(){ document.getElementById("overlay").classList.remove("show"); curOverlay={kind:null}; }

function scoreTableHTML(){
  const S=SCORING[settings.scoring];
  let rows="";
  ORDER.forEach(k=>{ if(k==="high") return;
    rows+='<tr><td>'+NAMEOF[k]+'</td><td>'+S[k]+'</td></tr>'; });
  return '<table>'+rows+'</table>';
}
function openRules(){
  const sysName = settings.scoring==="american" ? "American" : "English";
  const html='<button class="btn sec sm close" onclick="closeOverlay()">✕</button><h2>🎴 Poker Squares</h2>'
    +'<p>Cards are dealt <b>one at a time</b> into a 5×5 grid. Tap any empty square to drop the card shown in the tray. Once it is down it stays put — <b>Undo</b> only reverses your most recent placement.</p>'
    +'<p>When all 25 squares are full, each of the <b>5 rows</b> and <b>5 columns</b> is scored as a poker hand. Your total is the sum of all ten. Aces play high or low, <b>A-2-3-4-5</b> counts as a straight, and <b>10-J-Q-K-A</b> of one suit is a royal flush.</p>'
    +'<h3>Scoring — '+sysName+' system</h3>'
    +scoreTableHTML()
    +'<p class="muted">Switch between the American and English point systems in the Menu. American mirrors real-poker rarity; English rewards how hard each hand is to build inside the grid.</p>';
  openPanel(html,"rules");
}
function openMenu(){
  const html='<button class="btn sec sm close" onclick="closeOverlay()">✕</button><h2>⚙ Menu</h2>'
    +'<div class="switch" style="display:flex;margin:10px 0;"><button class="toggle '+(settings.tipsOn?'on':'')+'" onclick="menuToggleTips()"></button><span>Tips '+(settings.tipsOn?'ON':'OFF')+'</span></div>'
    +'<div class="switch" style="display:flex;margin:10px 0;"><button class="toggle '+(settings.fourColor?'on':'')+'" onclick="menuToggleFour()"></button><span>Four-color deck (♠ black · ♥ red · ♦ blue · ♣ green)</span></div>'
    +'<div style="margin:12px 0 4px;font-size:13px;">Scoring system</div>'
    +'<div class="seg"><button class="'+(settings.scoring==="american"?'on':'')+'" onclick="setScoring(\'american\')">American</button><button class="'+(settings.scoring==="english"?'on':'')+'" onclick="setScoring(\'english\')">English</button></div>'
    +'<div style="height:6px"></div>'
    +'<button class="setup-opt" onclick="closeOverlay();newGame();">🔀 New game</button>'
    +'<a class="setup-opt" href="../">🏠 Back to all games</a>'
    +'<button class="setup-opt" onclick="openRules()">📖 How to play</button>'
    +'<div style="text-align:center;margin-top:8px;"><button class="btn sec" onclick="closeOverlay()">Resume</button></div>';
  openPanel(html,"menu");
}
function openResults(total){
  const {rows,cols}=computeLines();
  let sc='<div class="scorecard">';
  for(let i=0;i<5;i++) sc+='<div class="h">Row '+(i+1)+'</div><div>'+(rows[i]?rows[i].name:'—')+'</div>';
  for(let j=0;j<5;j++) sc+='<div class="h">Col '+(j+1)+'</div><div>'+(cols[j]?cols[j].name:'—')+'</div>';
  sc+='</div>';
  const beat = total>=best && total>0;
  const html='<button class="btn sec sm close" onclick="closeOverlay()">✕</button><h2>'+(beat?'🏆 New best!':'✅ Board complete')+'</h2>'
    +'<p style="font-size:26px;font-weight:900;color:var(--gold);text-align:center;margin:6px 0;">'+total+' pts</p>'
    +'<p class="muted" style="text-align:center;margin-top:0;">Best '+best+' · '+(settings.scoring==="american"?"American":"English")+' scoring</p>'
    +sc
    +'<div style="text-align:center;margin-top:12px;"><button class="btn" onclick="closeOverlay();newGame();">🔀 New game</button></div>';
  openPanel(html,"results");
}

/* ---- toggles ---- */
function menuToggleTips(){ settings.tipsOn=!settings.tipsOn; persist(); render(); openMenu(); }
function menuToggleFour(){ settings.fourColor=!settings.fourColor; persist(); render(); openMenu(); }
function setScoring(s){ settings.scoring=s; persist(); render(); openMenu(); }

/* ---- wire up ---- */
document.getElementById("rulesBtn").onclick=openRules;
document.getElementById("menuBtn").onclick=openMenu;
document.getElementById("psUndo").onclick=undo;
document.getElementById("psNew").onclick=function(){ newGame(); };
document.getElementById("overlay").addEventListener("click",function(e){ if(e.target===this) closeOverlay(); });

newGame();

/* service worker (shared shell) */
if('serviceWorker' in navigator){
  addEventListener('load', function(){
    navigator.serviceWorker.register('../sw.js', {updateViaCache:'none'}).then(function(reg){
      reg.update();
      setInterval(function(){ reg.update(); }, 60*60*1000);
    }).catch(function(){});
    var reloaded=false;
    navigator.serviceWorker.addEventListener('controllerchange', function(){
      if(reloaded) return; reloaded=true; location.reload();
    });
  });
}
</script>
<div class="gn-build" id="gnBuild"></div>
<style>.gn-build{text-align:center;font-size:10.5px;opacity:.5;margin:16px 0 10px;
  font-family:ui-monospace,Menlo,monospace;letter-spacing:.3px;}</style>
<script>
/* build stamp — bumped with the sw.js cache version */
(function(){
  var V="v68", ISO=document.lastModified;   // GitHub Pages sends Last-Modified = the deploy time, so this tracks the build you're actually running
  var d=new Date(ISO), when=isNaN(d)?"":d.toLocaleString([], {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"});
  var el=document.getElementById("gnBuild"); if(el) el.textContent="build "+V+(when?" \u00b7 "+when:"");
})();
</script>
