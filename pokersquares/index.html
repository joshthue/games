  function pct(p){ return p>=1?"now":(p<.01?"<1%":Math.round(p*100)+"%"); }
  function chipFor(h){ const ab=h.royal?"RF":"SF";
    return {cls:"psscore ngdraw n"+h.n+(h.royal?" royal":""), html:'<span class="ab">'+ab+(h.n===4?"!":"?")+'</span><span class="pts">'+pct(h.p)+'</span>'}; }
  function applyHeat(H){
    const board=document.getElementById("psboard"), tray=document.querySelector(".pstray");
    let jack=false, jackRoyal=false;
    H.forEach(function(h){
      h.cells.forEach(function(x){ const el=cellEl(x); if(!el) return; el.classList.add(h.n===4?"h2":"h1"); if(h.royal) el.classList.add("royal"); });
      if(h.n===4){ const t=h.cells.find(x=>!grid[x]), el=cellEl(t);
        if(el){ el.classList.add("target"); if(h.inTray){ el.classList.add("jack"); jack=true; if(h.trayRoyal) jackRoyal=true; }
          el.innerHTML='<span class="ng-ghost">'+h.outs.map(c=>'<b class="'+(h.royalOuts.indexOf(cardKey(c))>=0?'ro':'')+'" style="color:'+suitColor(c.s)+'">'+cname(c)+'</b>').join("")+'</span>'; } }
      const ch=board.querySelector('.psscore[data-line="'+h.key+'"]');
      if(ch){ const f=chipFor(h); ch.className=f.cls; ch.innerHTML=f.html; ch.title=(h.royal?"Royal":"Straight")+" flush still possible · "+pct(h.p); } });
    board.classList.toggle("jackpot",jack); if(tray){ tray.classList.toggle("jackpot",jack); tray.classList.toggle("royal",jackRoyal); }
    if(jack) startBeat(); else stopBeat(); }
  let prev={}, quiet=false, tok=0, beat=null;
  function startBeat(){ if(beat) return; beat=setInterval(function(){ if(curOverlay.kind||over) return; snd("heart");
    if(window.GN_HAPTICS) hap(1,0,"beat"); else if(navigator.vibrate && ngs.haptics){ try{ navigator.vibrate([14,170,10]); }catch(e){} } },1100); }
  function stopBeat(){ if(beat){ clearInterval(beat); beat=null; } }
  function lineMid(h){ const els=h.cells.map(cellEl).filter(Boolean); if(els.length<5) return null; const a=els[0].getBoundingClientRect(), b=els[4].getBoundingClientRect();
    return {x:(a.left+b.right)/2, y:(a.top+b.bottom)/2}; }
  function clearCalls(){ document.querySelectorAll(".pscall.ngc").forEach(function(el){ el.remove(); }); }
  function callout(h,cls,html,ms){ const m=lineMid(h); if(!m) return; clearCalls(); const el=document.createElement("div"); el.className="pscall ngc "+cls; el.innerHTML=html;
    el.style.left=m.x+"px"; el.style.top=m.y+"px"; document.body.appendChild(el); setTimeout(function(){ el.remove(); },ms||2300); return m; }
  function fire(e,myTok){ if(myTok!==tok) return; const h=e.h, pan=h.type==="col"?panOfCol(h.idx):0, need=h.outs.map(cname).join(" or ");
    if(e.k==="draw"){ callout(h,"draw"+(h.royal?" royal":""),(h.royal?"Royal flush draw":"Straight flush draw")+'<small>need '+need+' · '+pct(h.p)+'</small>',2300);
      snd("shimmer",pan); if(h.royal) snd("riser"); hap(2,80,"medium");
      const m=lineMid(h); if(m) emit(m.x,m.y,{n:h.royal?26:18,dir:-Math.PI/2,spread:1.4,sp:120,g:-40,drag:.97,s:6,life:1300,colors:h.royal?["#ffd36b","#ff9a3d","#fff1c4"]:["#7cc4ff","#a98bff","#e4f2ff"],jx:120,jy:20}); }
    else if(e.k==="warm"){ callout(h,"warm"+(h.royal?" royal":""),h.royal?"Three to a royal":"Straight flush alive",1700); snd("glint",pan); }
    else if(e.k==="jack"){ callout(h,"jack"+(h.trayRoyal?" royal":""),"It's here!"+'<small>'+cname(current)+(h.trayRoyal?" makes the royal":" makes the straight flush")+'</small>',2400);
      snd("riser"); setTimeout(function(){ snd("heart"); },500); hap(3,90,"heavy");
      const c=document.querySelector("#psCurrent .card"); if(c){ const p=center(c); ring(p.x,p.y,p.w*.5,p.w*1.6,h.trayRoyal?"rgba(255,207,90,.95)":"rgba(160,170,255,.95)",700);
        emit(p.x,p.y,{n:24,sp:200,s:7,life:900,g:60,colors:h.trayRoyal?["#ffd36b","#fff1c4","#ff9a3d"]:["#7cc4ff","#a98bff","#ffffff"]}); } }
    else if(e.k==="dead"){ callout(h,"dead",'<s>'+(h.royal?"Royal":"Straight flush")+' draw</s> dead',1500); snd("fizzle",pan); } }
  function events(H){
    if(over){ prev={}; stopBeat(); return; }
    const now={}; H.forEach(h=>{ now[h.key]=h; }); const ev=[];
    if(!quiet){
      H.forEach(function(h){ const p=prev[h.key];
        if(h.n===4 && (!p||p.n<4) && !h.inTray) ev.push({k:"draw",h:h});   // out already in the tray: "It's here" says it
        else if(h.n===3 && !p) ev.push({k:"warm",h:h});
        if(h.inTray && !(p&&p.inTray)) ev.push({k:"jack",h:h}); });
      Object.keys(prev).forEach(function(key){ const p=prev[key]; if(p.n===4 && !now[key] && !p.cells.every(x=>grid[x])) ev.push({k:"dead",h:p}); });
    }
    prev=now; quiet=false; const my=++tok;
    ev.forEach(function(e,n){ setTimeout(function(){ fire(e,my); }, 560+n*700); }); }

  /* ---- after every render ---- */
  function after(){
    const board=document.getElementById("psboard"); if(!board) return;
    board.querySelectorAll(".psscore").forEach(function(el,k){ if(k<10) el.dataset.line=k<5?("r"+k):("c"+(k-5)); });
    const g=viewGrid(), L=computeLines(g);
    LINES10.forEach(function(Ln,k){ const h=k<5?L.rows[Ln[1]]:L.cols[Ln[1]]; if(h && TIER[h.key]>=3) lineIdx(Ln[0],Ln[1]).forEach(function(x){ const c=cellEl(x); if(c) c.classList.add("holo"); }); });
    const tc=document.querySelector("#psCurrent .card.dealin"); if(tc) tc.addEventListener("animationend",function(){ tc.classList.remove("dealin"); },{once:true});
    const H=(g===grid)?heat():[];
    applyHeat(H); events(H); }
  function reset(){ prev={}; quiet=false; tok++; stopBeat(); document.querySelectorAll(".pscall,.ngcine").forEach(function(el){ el.remove(); }); }

  /* ---- drag the tray card onto a square, with a live preview ---- */
  let DR=null;
  function light(x,y){ const r=document.documentElement.style; r.setProperty("--lx",(x/innerWidth*100).toFixed(1)+"%"); r.setProperty("--ly",(y/innerHeight*100).toFixed(1)+"%"); }
  addEventListener("pointermove",function(e){ if(e.pointerType==="mouse" && !DR) light(e.clientX,e.clientY); },{passive:true});
  function tilt(x,y){ if(RM()) return; const b=document.getElementById("psboard"), r=DR.br; if(!r) return;
    const nx=Math.max(-1,Math.min(1,(x-(r.left+r.width/2))/(r.width/2))), ny=Math.max(-1,Math.min(1,(y-(r.top+r.height/2))/(r.height/2)));
    b.style.transform="perspective(900px) rotateX("+(-ny*2.5).toFixed(2)+"deg) rotateY("+(nx*2.5).toFixed(2)+"deg)"; }
  function untilt(instant){ const b=document.getElementById("psboard"); if(!b) return;
    if(instant){ b.style.transition="none"; b.style.transform=""; void b.offsetWidth; b.style.transition=""; } else b.style.transform=""; }
  function clearTarget(){ if(!DR) return;
    document.querySelectorAll("#psboard .dropt,#psboard .xhair").forEach(el=>el.classList.remove("dropt","xhair"));
    DR.saved.forEach(function(s){ s.el.className=s.cls; s.el.innerHTML=s.html; }); DR.saved=[];
    const d=document.getElementById("ngDelta"); if(d) d.classList.remove("on"); DR.target=-1; }
  function setTarget(i){ if(!DR || i===DR.target) return; clearTarget(); if(i<0) return; DR.target=i;
    const r=Math.floor(i/5), c=i%5, g2=grid.slice(); g2[i]=current; const L2=computeLines(g2), base=computeLines(grid).total;
    for(let k=0;k<5;k++){ [cellEl(r*5+k),cellEl(k*5+c)].forEach(el=>{ if(el) el.classList.add("xhair"); }); }
    const t=cellEl(i); if(t) t.classList.add("dropt");
    [["r"+r,L2.rows[r]],["c"+c,L2.cols[c]]].forEach(function(p){ if(!p[1]) return; const el=document.querySelector('#psboard .psscore[data-line="'+p[0]+'"]'); if(!el) return;
      DR.saved.push({el:el,cls:el.className,html:el.innerHTML}); const tmp=document.createElement("div"); tmp.innerHTML=chipHTML(p[1]); const n=tmp.firstChild;
      el.className=n.className+" preview"; el.innerHTML=n.innerHTML; });
    const d=document.getElementById("ngDelta"), delta=L2.total-base; if(d && delta>0){ d.textContent="+"+delta; d.classList.add("on"); }
    snd("hover",panOfCol(c)); if(window.GN_HAPTICS) hap(1,0,"select"); else if(navigator.vibrate && ngs.haptics){ try{ navigator.vibrate(4); }catch(e){} } }
  function frame(){ if(!DR) return; DR.vx*=.82;
    const rot=Math.max(-16,Math.min(16,DR.vx*.012)); DR.rot+=(rot-DR.rot)*.3;
    const cxp=DR.px-DR.ox, cyp=DR.py-DR.oy-DR.lift;
    DR.f.style.transform="translate("+(cxp-(DR.r.left+DR.r.width/2)).toFixed(1)+"px,"+(cyp-(DR.r.top+DR.r.height/2)).toFixed(1)+"px) rotate("+DR.rot.toFixed(2)+"deg) scale(1.1)";
    DR.raf=requestAnimationFrame(frame); }
  function onMove(e){ if(!DR) return; if(e.cancelable) e.preventDefault();
    const now=performance.now(), dt=Math.max(8,now-DR.lt), v=(e.clientX-DR.px)/dt*1000; DR.vx=DR.vx*.5+v*.5; DR.lt=now; DR.px=e.clientX; DR.py=e.clientY;
    if(Math.abs(e.clientX-DR.x0)+Math.abs(e.clientY-DR.y0)>6) DR.moved=true;
    const cxp=DR.px-DR.ox, cyp=DR.py-DR.oy-DR.lift; light(cxp,cyp); tilt(cxp,cyp);
    const el=document.elementFromPoint(cxp,cyp), t=el&&el.closest?el.closest("#psboard .pscell.empty.live"):null;
    setTarget(t?+t.dataset.i:-1); }
  function end(){ document.removeEventListener("pointermove",onMove); document.removeEventListener("pointerup",onUp); document.removeEventListener("pointercancel",onCancel);
    if(DR&&DR.raf) cancelAnimationFrame(DR.raf); }
  function onUp(){ const d=DR; if(!d) return; const target=d.target; clearTarget(); end(); DR=null;
    if(target>=0 && !over && current && !grid[target]){ ngFromRect=d.f.getBoundingClientRect(); d.f.remove(); untilt(true); place(target); return; }
    untilt(false);
    if(!d.moved || RM() || !d.f.animate){ d.f.remove(); d.c.style.visibility=""; return; }
    const a=d.f.animate([{transform:d.f.style.transform},{transform:"none"}],{duration:320,easing:"cubic-bezier(.3,1.5,.5,1)"});
    a.onfinish=function(){ d.f.remove(); d.c.style.visibility=""; }; snd("whoosh",0); }
  function onCancel(){ const d=DR; if(!d) return; clearTarget(); end(); DR=null; untilt(false); d.f.remove(); d.c.style.visibility=""; }
  const cur=document.getElementById("psCurrent");
  if(cur) cur.addEventListener("pointerdown",function(e){
    const c=cur.querySelector(".card"); if(!c||e.button>0||over||!current||BOT.on||ANIMATING||curOverlay.kind||DR||CLOCK.dumping) return;
    e.preventDefault(); const r=c.getBoundingClientRect(), f=c.cloneNode(true); f.classList.remove("dealin"); f.classList.add("ngdrag");
    Object.assign(f.style,{left:r.left+"px",top:r.top+"px",width:r.width+"px",height:r.height+"px"}); document.body.appendChild(f); c.style.visibility="hidden";
    DR={f:f,c:c,r:r,br:document.getElementById("psboard").getBoundingClientRect(),ox:e.clientX-(r.left+r.width/2),oy:e.clientY-(r.top+r.height/2),
      lift:e.pointerType==="touch"?Math.round(r.height*.45):0,px:e.clientX,py:e.clientY,lt:performance.now(),vx:0,rot:0,moved:false,target:-1,x0:e.clientX,y0:e.clientY,saved:[],raf:0};
    document.addEventListener("pointermove",onMove,{passive:false}); document.addEventListener("pointerup",onUp); document.addEventListener("pointercancel",onCancel);
    snd("whoosh",0); hap(1,0,"light"); frame(); onMove(e); });

  /* ---- end of the board: each scoring line lights in turn, then the results ---- */
  function tally(g,cb){
    const ok=()=>over && grid===g;
    if(RM()){ setTimeout(function(){ if(ok()) cb(); },1500); return; }
    const L=computeLines(grid), seq=[];
    LINES10.forEach(function(Ln,k){ const h=k<5?L.rows[Ln[1]]:L.cols[Ln[1]]; if(h&&h.pts>0) seq.push({t:Ln[0],i:Ln[1],k:k}); });
    setTimeout(function(){ if(!ok()) return;
      seq.forEach(function(s,n){ setTimeout(function(){ if(!ok()) return;
        lineIdx(s.t,s.i).forEach(function(x){ const c=cellEl(x); if(c){ c.classList.remove("tally"); void c.offsetWidth; c.classList.add("tally"); } });
        const ch=document.querySelector('#psboard .psscore[data-line="'+(s.k<5?"r"+s.i:"c"+s.i)+'"]'); if(ch){ ch.classList.remove("land"); void ch.offsetWidth; ch.classList.add("land"); }
        snd("tick",s.t==="col"?panOfCol(s.i):0,n); }, n*100); });
      setTimeout(function(){ if(ok()) cb(); }, seq.length*100+450); }, 1300); }

  /* ---- trophies ---- */
  const TRO=[
    {id:"first",  g:"b", n:"First Board",    d:"Finish a board."},
    {id:"flush",  g:"b", n:"Suited Up",      d:"Make a flush."},
    {id:"full",   g:"b", n:"Full House",     d:"Make a full house."},
    {id:"ten",    g:"s", n:"Ten for Ten",    d:"Every row and column scores."},
    {id:"century",g:"s", n:"Century",        d:"Score 100 (American) or 50 (English)."},
    {id:"four",   g:"s", n:"Quads",          d:"Make four of a kind."},
    {id:"big",    g:"g", n:"High Roller",    d:"Score 150 (American) or 75 (English)."},
    {id:"perfect",g:"g", n:"Perfect Board",  d:"Match the best board your 25 cards can make."},
    {id:"sflush", g:"g", n:"Straight Flush", d:"Make a straight flush."},
    {id:"stars3", g:"b", n:"Three Stars",    d:"Get three stars on a level."},
    {id:"clock",  g:"b", n:"Beat the Clock", d:"Clear a Blitz level."},
    {id:"icecold",g:"s", n:"Ice Cold",       d:"Score 100 (American) or 50 (English) with a clock on."},
    {id:"lv5",    g:"s", n:"Halfway Up",     d:"Clear level 5."},
    {id:"lv10",   g:"g", n:"Summit",         d:"Clear level 10."},
    {id:"royal",  g:"p", n:"Royal Flush",    d:"Make a royal flush."}];
  const GC={b:["#e0a26d","#9a5a2c"],s:["#f1f4f7","#9aa4ae"],g:["#ffe49a","#c8922e"],p:["#e8f7ff","#7fb6d9"]}, GN={b:"Bronze",s:"Silver",g:"Gold",p:"Platinum"};
  function cup(g){ const c=GC[g], id="cg"+g;
    return '<svg class="ngcup" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+c[0]+'"/><stop offset="1" stop-color="'+c[1]+'"/></linearGradient></defs>'
      +'<path d="M9 4h14v6.5a7 7 0 0 1-14 0z" fill="url(#'+id+')"/><path d="M9 7H5v1.5a5 5 0 0 0 5 5M23 7h4v1.5a5 5 0 0 1-5 5" fill="none" stroke="url(#'+id+')" stroke-width="2"/>'
      +'<rect x="14" y="17" width="4" height="5" fill="url(#'+id+')"/><rect x="9.5" y="22" width="13" height="5" rx="1.2" fill="url(#'+id+')"/></svg>'; }
  function got(){ try{ return JSON.parse(localStorage.getItem(KT))||{}; }catch(e){ return {}; } }
  let tq=[], tbusy=false;
  function earn(id){ const T=got(); if(T[id]) return; T[id]=Date.now(); try{ localStorage.setItem(KT,JSON.stringify(T)); }catch(e){}
    const t=TRO.find(x=>x.id===id); if(t){ tq.push(t); toastNext(); } }
  function toastNext(){ if(tbusy||!tq.length) return; tbusy=true; const t=tq.shift();
    const el=document.createElement("div"); el.className="ngtro"; el.innerHTML=cup(t.g)+'<div><div class="l1">'+GN[t.g]+' trophy</div><div class="l2">'+t.n+'</div></div>';
    document.body.appendChild(el); requestAnimationFrame(function(){ requestAnimationFrame(function(){ el.classList.add("on"); }); }); snd("ping");
    setTimeout(function(){ el.classList.remove("on"); setTimeout(function(){ el.remove(); tbusy=false; toastNext(); },500); },2800); }
  function trophies(total){ if(botTouched || (isLevels() && LV && LV.k>0)) return; const L=computeLines(grid), keys=L.rows.concat(L.cols).filter(Boolean).map(h=>h.key), am=settings.scoring==="american";
    earn("first");
    if(keys.indexOf("flush")>=0) earn("flush");
    if(keys.indexOf("full")>=0) earn("full");
    if(keys.indexOf("four")>=0) earn("four");
    if(keys.indexOf("sflush")>=0) earn("sflush");
    if(keys.indexOf("royal")>=0){ earn("sflush"); earn("royal"); }
    if(L.rows.concat(L.cols).every(h=>h&&h.pts>0)) earn("ten");
    if(total>=(am?100:50)) earn("century");
    if(total>=(am?150:75)) earn("big");
    if(CLOCK.kind!=="off" && total>=(am?100:50)) earn("icecold");
  }
  function perfect(){ if(!over||botTouched||!SOLVE||!SOLVE.done||(isLevels()&&LV&&LV.k>0)) return; const t=computeLines(grid).total; if(t>0 && t>=SOLVE.score) earn("perfect"); }
  function trophiesHTML(){ const T=got(), n=TRO.filter(t=>T[t.id]).length;
    return '<button class="btn sec sm close" onclick="openMenu()">‹ Back</button><h2>Trophies</h2><p class="muted" style="margin-top:0;">'+n+' of '+TRO.length+' on this device. Bot boards don\'t count.</p><ul class="trolist">'
      +TRO.map(t=>'<li class="'+(T[t.id]?'':'lock')+'">'+cup(t.g)+'<div><div class="tn">'+t.n+'</div><div class="td">'+t.d+'</div></div><span class="tw">'+(T[t.id]?new Date(T[t.id]).toLocaleDateString([],{month:"short",day:"numeric"}):GN[t.g])+'</span></li>').join("")+'</ul>'; }
  function openTrophies(){ openPanel(trophiesHTML(),"trophies"); }
  function toggleHaptics(){ ngs.haptics=!ngs.haptics; saveNg(); if(ngs.haptics) hap(1,0,"medium"); }

  function timeUp(text){ clearCalls(); const t=document.querySelector("#psCurrent .card")||document.getElementById("psCurrent"); if(!t) return;
    const r=t.getBoundingClientRect(), el=document.createElement("div"); el.className="pscall ngc dead"; el.style.left=(r.left+r.width/2)+"px"; el.style.top=(r.top+r.height/2)+"px";
    el.textContent=text; document.body.appendChild(el); setTimeout(function(){ el.remove(); },1500); snd("fizzle",0); hap(2,80,"heavy"); }
  return {cancelDrag:function(){ if(DR) onCancel(); }, timeUp:timeUp, hap:hap, after:after, reset:reset, quiet:function(){ quiet=true; }, land:land, lineBurst:lineBurst, tally:tally, trophies:trophies, perfect:perfect,
    openTrophies:openTrophies, clearCalls:clearCalls, toggleHaptics:toggleHaptics, get haptics(){ return ngs.haptics; }, snd:snd, heat:heat, panOfCol:panOfCol, _earn:earn, _P:function(){ return P.length; }};
})();

/* ---- wire up ---- */
document.getElementById("rulesBtn").onclick=()=>openRules();   // never hand openRules the click Event
document.getElementById("menuBtn").onclick=openMenu;
document.getElementById("hsBtn").onclick=function(){ HS.open(); };
document.getElementById("psUndo").onclick=undo;
document.getElementById("psNew").onclick=function(){ newGame(); };
document.getElementById("psBotGo").onclick=function(){ botStart(); };          // from a fresh board, or takes over yours
document.getElementById("psBotAuto").onclick=botToggleAuto;
document.getElementById("psBotNext").onclick=function(){ botMove(); };
document.getElementById("psBotStop").onclick=botTakeOver;
document.getElementById("overlay").addEventListener("click",function(e){ if(e.target===this) closeOverlay(); });

newGame();

/* service worker (shared shell) */
if('serviceWorker' in navigator){
  addEventListener('load', function(){
    navigator.serviceWorker.register('../sw.js', {updateViaCache:'none'}).then(function(reg){
      reg.update();
      setInterval(function(){ reg.update(); }, 60*60*1000);
    }).catch(function(){});
    var reloaded=false;
    navigator.serviceWorker.addEventListener('controllerchange', function(){
      if(reloaded) return; reloaded=true; location.reload();
    });
  });
}
</script>

  font-family:ui-monospace,Menlo,monospace;letter-spacing:.3px;}</style>

/* build stamp — bumped with the sw.js cache version */

  var d=new Date(ISO), when=isNaN(d)?"":d.toLocaleString([], {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"});
