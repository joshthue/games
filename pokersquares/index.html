<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Poker Squares</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#0b3f2b">
<link rel="apple-touch-icon" href="../icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root{ --felt:#0d5c3f;
    --size:1;   /* card scale, shared S/M/L/XL control (../cardsize.js) */ --felt2:#0a4a33; --wood:#8a5a2b; --wood2:#6b4420;
    --gold:#f0c674; --cream:#f7f3e8; --ink:#1c2a24; --red:#c22; --green:#178a3a; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--felt);
    color:var(--cream); min-height:100vh; overflow-x:hidden; display:flex; flex-direction:column; align-items:center;}
  .wrap{width:100%; max-width:520px; padding:8px 12px 22px; position:relative;}
  header{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:4px;}
  h1{font-size:19px; margin:0; letter-spacing:1px; color:var(--gold); text-shadow:0 1px 2px rgba(0,0,0,.5);}
  h1 small{display:block; font-size:10px; letter-spacing:2px; opacity:.7; font-weight:600;}
  .top-btns{display:flex; gap:6px;}
  button{font-family:inherit; cursor:pointer; border:none; border-radius:10px; font-weight:600; transition:transform .06s, filter .15s;}
  button:active{transform:translateY(1px) scale(.98);}
  .btn{background:var(--gold); color:var(--ink); padding:9px 14px; font-size:14px; box-shadow:0 2px 5px rgba(0,0,0,.35);}
  .btn.sec{background:rgba(255,255,255,.14); color:var(--cream);} .btn.sm{padding:6px 10px; font-size:12px;}
  .btn:disabled{opacity:.4; cursor:default;}
  a.btn{text-decoration:none; display:inline-block;}

  /* ---- to-place tray ---- */
  .pstray{display:flex; align-items:center; gap:12px; justify-content:center;
    background:linear-gradient(180deg,var(--wood),var(--wood2)); border-radius:12px; padding:10px 12px; margin:6px 0 10px;
    box-shadow:inset 0 2px 6px rgba(0,0,0,.3),0 3px 8px rgba(0,0,0,.4);}
  .pstray #psCurrent{flex:0 0 auto;}
  /* text on the wood is cream, not brown: dark brown at partial opacity on wood was unreadable */
  .pstray-info{flex:1 1 auto; text-align:center; color:var(--cream); font-weight:800; min-width:0; text-shadow:0 1px 2px rgba(0,0,0,.45);}
  .pstray-place{font-size:14px;} .pstray-prog{font-size:12px; margin-top:2px;}
  .pstray-score{flex:0 0 auto; text-align:center; color:var(--cream); text-shadow:0 1px 2px rgba(0,0,0,.45);}
  .pstray-score .lbl{font-size:10px; letter-spacing:1px; font-weight:700;}
  .pstray-score .num{font-size:26px; font-weight:900; line-height:1; color:var(--gold);}
  .pstray-score .best{font-size:11px; font-weight:700; margin-top:2px; white-space:nowrap;}

  /* ---- cards ---- */
  .card{width:calc(52px * var(--size)); height:calc(74px * var(--size)); border-radius:8px; background:var(--cream); color:var(--ink); position:relative;
    box-shadow:0 2px 5px rgba(0,0,0,.4); flex:0 0 auto; user-select:none; border:1px solid #d8d2c0; overflow:hidden;}
  .card .rank{position:absolute; top:4px; left:6px; font-size:calc(15px * var(--size) * var(--cardtext,1)); font-weight:800; line-height:1;}
  .card .rankb{position:absolute; bottom:4px; right:6px; font-size:calc(15px * var(--size) * var(--cardtext,1)); font-weight:800; line-height:1; transform:rotate(180deg);}
  .card .pip{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:calc(26px * var(--size) * var(--cardtext,1));}
  /* four-color toggle and card size share a row - the size control goes BESIDE it, not below */
  .optrow{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-top:8px;}
  .seg.cardsize button,.seg.cardtext button{padding:5px 9px; font-size:12px; min-width:30px;}
  .card.back{background:repeating-linear-gradient(45deg,#1b6fb3,#1b6fb3 7px,#155a94 7px,#155a94 14px); border:2px solid #0e3f6b;}

  /* ---- 5x5 board + row/col score chips ---- */
  .psboard{display:grid; grid-template-columns:repeat(5,1fr) minmax(30px,auto); gap:5px; width:100%; max-width:440px; margin:0 auto;}
  .pscell{position:relative; height:var(--cellh, clamp(50px,14.5vw,66px)); border-radius:7px; display:flex; align-items:center; justify-content:center; overflow:hidden;}
  .pscell.empty{background:rgba(0,0,0,.18); border:1.5px dashed rgba(247,243,232,.3);}
  .pscell.empty.live{border-color:var(--gold); background:rgba(240,198,116,.10); cursor:pointer;}
  .pscell.filled{background:var(--cream); box-shadow:0 1px 3px rgba(0,0,0,.4); border:1px solid #d8d2c0;}
  .pscell.just{animation:pop .18s ease-out;}
  @keyframes pop{from{transform:scale(.82);}to{transform:scale(1);}}
  .psmini{font-weight:800; line-height:1; text-align:center; display:flex; flex-direction:column; align-items:center;}
  .psmini .r{font-size:calc(clamp(13px,4.1vw,18px) * var(--cardtext,1));}
  .psmini .s{font-size:calc(clamp(15px,4.6vw,20px) * var(--cardtext,1)); margin-top:1px;}
  .psscore{display:flex; flex-direction:column; align-items:center; justify-content:center; padding:2px; color:var(--gold); font-weight:800; min-height:34px;}
  .psscore .ab{font-size:9px; letter-spacing:.5px; opacity:.85;}
  .psscore .pts{font-size:13px; color:var(--cream);}
  .psscore.has{filter:drop-shadow(0 0 4px rgba(240,198,116,.5));}
  .psscore.has .pts{color:var(--gold);}
  .psscore .dot{opacity:.4; font-size:14px;}
  .psscore.corner{background:var(--gold); color:var(--ink); border-radius:8px;}
  .psscore.corner .ab{opacity:.7; color:var(--ink);} .psscore.corner .pts{color:var(--ink); font-size:15px;}

  /* ---- best-board view ---- */
  .pscell.ghost{visibility:hidden;}
  .psboard.isbest .pscell.filled{border-color:var(--gold); box-shadow:0 0 0 1.5px var(--gold),0 1px 3px rgba(0,0,0,.4);}
  .psboard.anim .psscore .pts,.psboard.anim .psscore .ab{opacity:.25; transition:opacity .2s;}
  .psscore.land{animation:pop .3s ease-out;}
  .flycard{position:fixed; z-index:45; margin:0; border-radius:7px; background:var(--cream); border:1px solid #d8d2c0;
    display:flex; align-items:center; justify-content:center; pointer-events:none; will-change:transform;
    box-shadow:0 10px 22px rgba(0,0,0,.55);}
  /* ---- read-only board shown from a leaderboard row ---- */
  .psboard.ro{max-width:360px; gap:4px;}
  .psboard.ro .pscell{height:clamp(40px,11vw,54px); border-radius:6px;}
  .psboard.ro .psscore{min-height:26px;} .psboard.ro .psscore .pts{font-size:12px;} .psboard.ro .psscore .ab{font-size:8px;}
  .boardwrap{text-align:center;}
  .boardwrap .bhead{display:flex; align-items:baseline; justify-content:center; gap:8px; margin:2px 0 8px; flex-wrap:wrap;}
  .boardwrap .bhead .pts{font-size:24px; font-weight:900; color:var(--gold); line-height:1;}
  .boardwrap .bhead .sub{font-size:13px; opacity:.8;}
  .boardwrap .bnote{font-size:12px; opacity:.8; margin-top:8px; min-height:16px;}
  .hs li.tap{cursor:pointer;} .hs li.tap:active{background:rgba(255,255,255,.06); border-radius:6px;}
  .hs li .vb{font-size:10px; opacity:.55; letter-spacing:.3px;}
  .bestbar{max-width:440px; margin:12px auto 0; text-align:center;}
  .bestbar .seg button{padding:7px 12px;}
  .bestbar .bbrow{display:flex; justify-content:center; align-items:center; gap:8px; flex-wrap:wrap;}
  .bestbar .note{font-size:12px; opacity:.8; margin-top:6px; min-height:16px;}
  @media (max-height:640px){ .bestbar .note{display:none;} }
  .solvebox{margin:4px 0 0; font-size:14px; line-height:1.45;}
  .solvebox b{color:var(--gold);}
  .solvebox .bar{height:5px; border-radius:3px; background:rgba(255,255,255,.12); margin-top:8px; overflow:hidden;}
  .solvebox .bar i{display:block; height:100%; width:0; background:var(--gold); transition:width .3s;}
  .controls{display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin-top:14px;}
  .controls.hidden{display:none;}
  .botbar{align-items:center;} .botbar .switch{margin-right:4px;}
  .tip-block{background:rgba(0,0,0,.22); border-left:3px solid var(--gold); border-radius:8px; padding:8px 12px; margin:8px auto; font-size:13px; line-height:1.5; max-width:440px;}
  .tip-block b{color:var(--gold);}

  /* ---- overlay / panel / controls (shared conventions) ---- */
  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.62); display:none; align-items:center; justify-content:center; z-index:50; padding:16px;}
  .overlay.show{display:flex;}
  .panel{background:linear-gradient(180deg,#12503a,#0c3d2c); border:2px solid var(--gold); border-radius:16px;
    max-width:520px; width:100%; max-height:88vh; overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; padding:18px; box-shadow:0 10px 40px rgba(0,0,0,.6);}
  .panel h2{margin:0 0 6px; color:var(--gold); font-size:20px;} .panel h3{color:var(--gold); font-size:15px; margin:14px 0 6px;}
  .panel p,.panel li{font-size:14px; line-height:1.5;} .panel ul{margin:4px 0 4px 2px; padding-left:20px;}
  .panel table{width:100%; border-collapse:collapse; font-size:13px; margin:4px 0;}
  .panel td{padding:3px 6px; border-bottom:1px solid rgba(255,255,255,.12);} .panel td:last-child{text-align:right; color:var(--gold); font-weight:700;}
  .panel tr.hi td{color:#fff;} .panel tr.hi td:last-child{color:var(--gold);}
  .panel .close{position:sticky; top:0; float:right;}
  .switch{display:flex; align-items:center; gap:8px; font-size:13px;}
  .seg{display:inline-flex; vertical-align:middle; background:rgba(0,0,0,.3); border-radius:20px; padding:3px; gap:3px;}
  .seg button{background:transparent; color:var(--cream); padding:6px 14px; font-size:13px; border-radius:16px;}
  .seg button.on{background:var(--gold); color:var(--ink);}
  .toggle{width:44px; height:24px; border-radius:14px; background:rgba(0,0,0,.4); position:relative; padding:0; flex:0 0 auto;}
  .toggle::after{content:""; position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:var(--cream); transition:left .18s;}
  .toggle.on{background:var(--gold);} .toggle.on::after{left:22px;}
  .setup-opt{display:block; width:100%; text-align:left; background:rgba(255,255,255,.1); color:var(--cream); padding:13px 14px; border-radius:10px; margin:7px 0; font-size:15px; text-decoration:none;}
  .stats{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin:10px 0 0;}
  .stats div{background:rgba(0,0,0,.22); border-radius:9px; padding:7px 4px 6px; text-align:center; min-width:0;}
  .stats span{display:block; font-size:10px; letter-spacing:.6px; text-transform:uppercase; opacity:.7; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .stats b{display:block; font-size:19px; font-weight:900; color:var(--gold); line-height:1.25; font-variant-numeric:tabular-nums;}
  .stats .bar{grid-column:1/-1; margin-top:2px; height:4px; border-radius:2px; background:rgba(255,255,255,.12); padding:0; overflow:hidden;}
  .stats .bar i{display:block; height:100%; background:var(--gold); transition:width .3s;}
  .stats-note{font-size:12px; opacity:.75; text-align:center; margin-top:5px;}
  @media (max-height:640px){ .panel{padding:12px 14px;} .panel h2{font-size:18px; margin-bottom:2px;} .res-top .pts{font-size:26px;}
    .hs{padding:8px 10px; margin:8px 0;} .hs li{padding:3px 2px;} .stats-note{display:none;} .res-btns{margin-top:10px;} }
  .res-top{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin:2px 0 2px;}
  .res-top .pts{font-size:30px; font-weight:900; color:var(--gold); line-height:1;}
  .res-top .sub{font-size:13px; opacity:.75;}
  .res-btns{display:flex; gap:8px; margin-top:12px;} .res-btns .btn{flex:1 1 0;}
  .hs .hs-h{display:flex; justify-content:space-between; align-items:baseline;}
  .hs .hs-all{background:none; border:none; color:var(--gold); font-size:13px; font-weight:700; padding:0; white-space:nowrap;}
  .muted{opacity:.75; font-size:12px;}
  /* ---- shared high-score board (v105) ---- */
  .hs{background:rgba(0,0,0,.22); border-radius:10px; padding:10px 12px; margin:10px 0;}
  .hs h3{margin:0 0 6px !important;}
  .hs ol{list-style:none; margin:0; padding:0; font-size:14px;}
  .hs li{display:grid; grid-template-columns:22px 1fr auto auto; gap:8px; align-items:baseline; padding:4px 2px; border-bottom:1px solid rgba(255,255,255,.08);}
  .hs li:last-child{border-bottom:none;}
  .hs li .rk{opacity:.6; font-weight:700; text-align:right;}
  .hs li .nm{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:700;}
  .hs li .sc{color:var(--gold); font-weight:900;}
  .hs li .dt{font-size:11px; opacity:.6; min-width:42px; text-align:right;}
  .hs li.me{background:rgba(240,198,116,.18); border-radius:6px;}
  .hs .st{font-size:11px; opacity:.6; margin-top:6px; text-align:center;}
  .hs-enter{display:flex; gap:8px; margin-top:6px;}
  .hs-enter .btn{white-space:nowrap;}
  .hs-enter input{flex:1 1 auto; min-width:0; font:inherit; font-size:16px; padding:9px 10px; border-radius:9px; border:1.5px solid var(--gold); background:rgba(0,0,0,.3); color:var(--cream);}
  @media(max-width:360px){ .pstray-score .num{font-size:22px;} h1{font-size:17px;} }

  /* ================= v201: the 2030 cabinet =================
     Same felt, header, cards and rules. The tray is a dark glass console (lit slot for the next
     card, a rolling gold score, 25 lights for progress); the squares are recessed glass; the line
     scores are lit pills that glow brighter the better the hand; a finished row or column sweeps
     light across its cards and calls the hand out. Everything here is decoration: no rule reads it. */
  :root{ --glass:#0a2219; --glass2:#061510; --edge:rgba(240,198,116,.42); --glow:rgba(240,198,116,.55); }
  .pstray{position:relative; overflow:hidden; gap:14px; padding:11px 14px; border-radius:16px;
    background:radial-gradient(130% 150% at 50% 0%,#174230 0%,var(--glass) 55%,var(--glass2) 100%);
    border:1px solid var(--edge);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.07),inset 0 0 26px rgba(0,0,0,.55),0 8px 22px rgba(0,0,0,.45),0 0 22px rgba(240,198,116,.10);}
  .pstray::after{content:""; position:absolute; top:0; bottom:0; width:40%; left:-50%; pointer-events:none;
    background:linear-gradient(100deg,transparent,rgba(255,240,200,.07),transparent); animation:psSheen 7s ease-in-out infinite;}
  @keyframes psSheen{0%,70%{left:-50%}100%{left:120%}}
  #psCurrent{position:relative;}
  #psCurrent::before{content:""; position:absolute; inset:-14px; border-radius:50%; pointer-events:none;
    background:radial-gradient(closest-side,rgba(240,198,116,.32),transparent); }
  #psCurrent .card{position:relative; box-shadow:0 0 0 1px rgba(240,198,116,.55),0 6px 16px rgba(0,0,0,.55);
    background:linear-gradient(160deg,#fffdf6,#f1e9d3);}
  #psCurrent .card.dealin{animation:psDealIn .32s cubic-bezier(.2,.8,.3,1);}
  @keyframes psDealIn{from{transform:translateX(-46px) rotate(-14deg); opacity:0}}
  .pstray-place{font-size:15px; letter-spacing:.2px;}
  .pstray-prog{font-size:11px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase; opacity:.7; margin-top:3px;}
  .psmeter{display:grid; grid-template-columns:repeat(25,1fr); gap:2px; margin:7px auto 0; max-width:190px;}
  .psmeter i{height:4px; border-radius:2px; background:rgba(255,255,255,.10);}
  .psmeter i.on{background:var(--gold); box-shadow:0 0 5px var(--glow);}
  .psmeter i.now{background:rgba(240,198,116,.5); animation:psBreath 1.4s ease-in-out infinite;}
  .pstray-score .lbl{font-size:9px; letter-spacing:2.2px; opacity:.75;}
  .pstray-score .num{font-family:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif; font-size:32px; font-weight:800;
    font-variant-numeric:tabular-nums; letter-spacing:-.5px; color:#ffe2a0;
    text-shadow:0 0 10px rgba(240,198,116,.65),0 0 2px rgba(255,220,150,.9),0 2px 0 rgba(0,0,0,.35);}
  .pstray-score .num.bump{animation:psBump .45s ease-out;}
  @keyframes psBump{30%{transform:scale(1.18); color:#fff}}
  .pstray-score .best{font-size:10px; letter-spacing:1px; text-transform:uppercase; opacity:.75;}

  /* the squares: recessed glass; the open ones breathe while you have a card to place */
  .psboard{gap:6px;}
  .pscell{border-radius:9px;}
  .pscell.empty{background:linear-gradient(180deg,rgba(0,0,0,.30),rgba(0,0,0,.14)); border:1px solid rgba(240,198,116,.16);
    box-shadow:inset 0 2px 7px rgba(0,0,0,.45);}
  .pscell.empty.live{border-color:rgba(240,198,116,.5); background:linear-gradient(180deg,rgba(0,0,0,.26),rgba(240,198,116,.07));
    animation:psBreath 2.4s ease-in-out infinite;}
  .pscell.empty.live:hover{background:rgba(240,198,116,.16); border-color:var(--gold);}
  @keyframes psBreath{50%{box-shadow:inset 0 2px 7px rgba(0,0,0,.45),0 0 10px rgba(240,198,116,.22)}}
  .pscell.filled{background:linear-gradient(160deg,#fffdf6,#f1e9d3); border:1px solid #e2d8bd; box-shadow:0 2px 5px rgba(0,0,0,.45);}
  .pscell.just{animation:psLand .22s ease-out;}
  @keyframes psLand{from{transform:scale(1.12)}}
  .pscell.sweep::after{content:""; position:absolute; inset:0; pointer-events:none; animation-delay:var(--d,0ms) !important;
    background:linear-gradient(105deg,transparent 25%,rgba(255,232,160,.85) 50%,transparent 75%);
    transform:translateX(-130%); animation:psSweep .6s ease-out forwards;}
  @keyframes psSweep{to{transform:translateX(130%)}}

  /* line scores: lit pills, brighter by hand (t1 pairs ... t4 straight / royal flush) */
  .psscore{border-radius:9px; min-height:36px; background:rgba(0,0,0,.22); border:1px solid rgba(240,198,116,.10);}
  .psscore .dot{opacity:.3;}
  .psscore.has{filter:none;}
  .psscore.t0 .ab{opacity:.45;}
  .psscore.t1{border-color:rgba(240,198,116,.35);}
  .psscore.t2{border-color:var(--gold); background:rgba(240,198,116,.12); box-shadow:0 0 8px rgba(240,198,116,.30);}
  .psscore.t3{border-color:#ffd77e; background:rgba(240,198,116,.22); box-shadow:0 0 14px rgba(240,198,116,.55);}
  .psscore.t3 .pts,.psscore.t4 .pts{color:#fff3cf;}
  .psscore.t4{border-color:#fff0bf; background:linear-gradient(120deg,#b8862e,#ffe29a,#c8953a,#ffe29a,#b8862e); background-size:300% 100%;
    animation:psFoil 2.5s linear infinite; box-shadow:0 0 18px rgba(255,220,140,.75);}
  .psscore.t4 .ab,.psscore.t4 .pts{color:#2a1c05;}
  @keyframes psFoil{to{background-position:300% 0}}
  .psscore.corner{background:linear-gradient(180deg,#ffe29a,var(--gold) 55%,#c9973d); border:1px solid #fff0bf;
    box-shadow:0 0 14px rgba(240,198,116,.45);}

  /* a finished line calls its hand out over its five cards */
  .pscall{position:fixed; z-index:44; pointer-events:none; transform:translate(-50%,-50%); white-space:nowrap; text-align:center;
    font:900 15px/1 ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif; letter-spacing:1.5px; text-transform:uppercase;
    color:#ffe7ae; background:rgba(6,21,16,.88); border:1px solid var(--gold); border-radius:999px; padding:7px 13px 6px;
    box-shadow:0 0 18px rgba(240,198,116,.45),0 6px 16px rgba(0,0,0,.5); animation:psCall 1.25s ease-out forwards;}
  .pscall b{color:#fff; margin-left:6px;}
  .pscall.t3{font-size:18px;} .pscall.t4{font-size:21px; color:#2a1c05; border-color:#fff0bf;
    background:linear-gradient(120deg,#c8953a,#ffe9b0,#c8953a);}
  .pscall.t4 b{color:#2a1c05;}
  .pscall.t0{font-size:12px; color:rgba(247,243,232,.65); border-color:rgba(247,243,232,.25); box-shadow:none;}
  @keyframes psCall{0%{opacity:0; transform:translate(-50%,-30%) scale(.7)} 14%{opacity:1; transform:translate(-50%,-50%) scale(1.08)}
    24%{transform:translate(-50%,-50%) scale(1)} 78%{opacity:1} 100%{opacity:0; transform:translate(-50%,-95%)}}
  .flycard.deal{z-index:46; box-shadow:0 10px 22px rgba(0,0,0,.5),0 0 0 1px rgba(240,198,116,.5);}
  @media (prefers-reduced-motion:reduce){
    .pstray::after,.pscell.empty.live,.psmeter i.now,.psscore.t4{animation:none}
    .pscell.sweep::after{display:none} #psCurrent .card.dealin,.pstray-score .num.bump{animation:none}
    .pscall{animation:psCallFade 1.1s forwards}
  }
  @keyframes psCallFade{0%,75%{opacity:1}100%{opacity:0}}
  @media(max-width:360px){ .pstray-score .num{font-size:25px;} .pstray{gap:10px; padding:10px;} }

  /* ================= v204: next-gen =================

<script>
/* ============================================================
   POKER SQUARES (a.k.a. Poker Solitaire / Poker Patience)
   Deal 25 cards one at a time into a 5x5 grid. Once a card is
   placed it can't be moved (Undo reverses your last placement
   only). When all 25 are down, each of the 5 rows and 5 columns
   scores as a poker hand; the total is the sum. Beat your best.
   ============================================================ */
const SUITS=["♠","♥","♦","♣"], SUIT_RED=[false,true,true,false];
const RSTR={11:"J",12:"Q",13:"K",14:"A"};
const FOURCOL=["#1c2a24","#c22","#1b6fb3","#178a3a"];   // ♠ black · ♥ red · ♦ blue · ♣ green

const NAMEOF={royal:"Royal flush",sflush:"Straight flush",four:"Four of a kind",full:"Full house",
  flush:"Flush",straight:"Straight",three:"Three of a kind",twopair:"Two pair",pair:"One pair",high:"High card"};
const ABBR={royal:"RF",sflush:"SF",four:"4K",full:"FH",flush:"FL",straight:"ST",three:"3K",twopair:"2P",pair:"1P",high:"—"};
const ORDER=["royal","sflush","four","full","flush","straight","three","twopair","pair","high"];
const SCORING={
  american:{royal:100,sflush:75,four:50,full:25,flush:20,straight:15,three:10,twopair:5,pair:2,high:0},
  english :{royal:30, sflush:30,four:16,full:10,flush:5, straight:12,three:6, twopair:3,pair:1,high:0}
};

const LS_KEY="pokersquares.v1";
let settings={tipsOn:false, fourColor:true, scoring:"american", botAuto:true, mode:"levels", clock:"off"};
let best=0;
try{ const raw=localStorage.getItem(LS_KEY); if(raw){ const o=JSON.parse(raw);
  if(o&&o.settings) Object.assign(settings,o.settings); if(o&&typeof o.best==="number") best=o.best; } }catch(e){}
function persist(){ try{ localStorage.setItem(LS_KEY, JSON.stringify({settings,best})); }catch(e){} }

/* ---- state ---- */
let grid=new Array(25).fill(null);
let queue=[];              // remaining deck (draw from end)
let current=null;          // card awaiting placement
let lastMove=null;         // {i, card} — single-step undo
let over=false;
let curOverlay={kind:null};

function rankStr(r){return RSTR[r]||String(r);}
function suitColor(s){ return settings.fourColor ? FOURCOL[s] : (SUIT_RED[s]?"#c22":"#1c2a24"); }
function makeDeck(){const d=[];for(let s=0;s<4;s++)for(let r=2;r<=14;r++)d.push({r,s});return d;}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ---- hand evaluation (5 cards) ---- */
function scoreHand(cards){
  if(!cards || cards.some(c=>!c)) return null;
  const rs=cards.map(c=>c.r).slice().sort((a,b)=>a-b);
  const ss=cards.map(c=>c.s);
  const flush=ss.every(s=>s===ss[0]);
  const uniq=[...new Set(rs)];
  let straight=false;
  if(uniq.length===5){
    if(rs[4]-rs[0]===4) straight=true;
    else if(rs[0]===2&&rs[1]===3&&rs[2]===4&&rs[3]===5&&rs[4]===14) straight=true; // wheel A-2-3-4-5
  }
  const cnt={}; rs.forEach(r=>cnt[r]=(cnt[r]||0)+1);
  const counts=Object.values(cnt).sort((a,b)=>b-a);
  let key;
  if(straight&&flush&&rs[0]===10&&rs[4]===14) key="royal";
  else if(straight&&flush) key="sflush";
  else if(counts[0]===4) key="four";
  else if(counts[0]===3&&counts[1]===2) key="full";
  else if(flush) key="flush";
  else if(straight) key="straight";
  else if(counts[0]===3) key="three";
  else if(counts[0]===2&&counts[1]===2) key="twopair";
  else if(counts[0]===2) key="pair";
  else key="high";
  return {key, name:NAMEOF[key], pts:SCORING[settings.scoring][key]};
}
function lineIdx(type,idx){ const a=[]; for(let k=0;k<5;k++) a.push(type==="row"? idx*5+k : k*5+idx); return a; }
function computeLines(g){
  g = g || viewGrid();
  const rows=[],cols=[]; let total=0;
  for(let i=0;i<5;i++){ const h=scoreHand(lineIdx("row",i).map(x=>g[x])); rows.push(h); if(h) total+=h.pts; }
  for(let j=0;j<5;j++){ const h=scoreHand(lineIdx("col",j).map(x=>g[x])); cols.push(h); if(h) total+=h.pts; }
  return {rows,cols,total};
}

/* ============================================================
   LEVELS (v207) — clear each board by scoring a share of the best board its cards can make.
   The 25 cards are known at the deal, so the solver runs in the background from the start and the
   target appears a few seconds in. Levels 1-3 come part-built: those squares are locked in from
   the best board for the deal, so the full target is still reachable and you can see what a good
   board looks like. Undo works on levels 1-3 only. Progress is kept per scoring system.
   ============================================================ */
const LV_LOCKS=[15,10,5];                                   // pre-filled squares on levels 1, 2, 3
// Calibrated with the bot's brain (Oct 31): pre-filled squares help a lot (its median on level 1
// is 86% of the best board), and a bare board is hard (37%). So 1-3 ask 40/40/38%, then the bare
// boards start at 34% and climb 2 points a level to 55% at level 15.
function levelPct(n){ return (n<=2?.40:n===3?.38:Math.min(.55,.34+.02*(n-4))) - (levelClock(n)!=="off"?.04:0); }
// Blitz: every 5th level is timed, 4 points easier. 5, 15, 25… the shot clock; 10, 20… the board clock.
function levelClock(n){ return n%5!==0?"off":(n%10===0?"board":"shot"); }
function isLevels(){ return settings.mode==="levels"; }
let LV=null, LVSOLVER=null;
function lvProg(){ let P; try{ P=JSON.parse(localStorage.getItem("pokersquares.levels"))||{}; }catch(e){ P={}; }
  const k=settings.scoring; P[k]=P[k]||{level:1,stars:{}}; return P; }
function lvSave(P){ try{ localStorage.setItem("pokersquares.levels",JSON.stringify(P)); }catch(e){} }
function lvUnlocked(){ return lvProg()[settings.scoring].level; }
// A fresh deal for level n: 25 cards, the locked squares (from the best board for them), the order
// the rest come to you, and the full layout the solver starts from.
function levelDeal(n){
  const deal=shuffle(makeDeck()).slice(0,25), k=LV_LOCKS[n-1]||0, locks=new Array(25).fill(null);
  let layout=deal.slice();
  if(k>0){
    const B=bestBoardFor(deal, settings.scoring).grid, L=computeLines(B);
    // lock the squares that matter most on that board (their row + column points, with a little
    // luck), but never more than 3 in a row or column: every line starts unfinished, so the
    // pre-filled board shows you the shape of a good board and you still have to build it
    const order=B.map((c,i)=>({i, v:((L.rows[(i/5)|0]||{}).pts||0)+((L.cols[i%5]||{}).pts||0)+Math.random()*6})).sort((a,b)=>b.v-a.v);
    for(let cap=3, got=0; got<k && cap<=5; cap++){
      const rc=[0,0,0,0,0], cc=[0,0,0,0,0]; locks.forEach((c,i)=>{ if(c){ rc[(i/5)|0]++; cc[i%5]++; } });
      for(const o of order){ if(got>=k) break; const r=(o.i/5)|0, c=o.i%5;
        if(locks[o.i] || rc[r]>=cap || cc[c]>=cap) continue; locks[o.i]=B[o.i]; rc[r]++; cc[c]++; got++; } }
    layout=B;
  }
  const lockedK=new Set(locks.filter(Boolean).map(cardKey));
  return {n, k, pct:levelPct(n), deal, locks, layout, order:shuffle(deal.filter(c=>!lockedK.has(cardKey(c)))),
    solved:false, max:null, target:null, solve:null, onSolved:null, result:null};
}
function levelSolve(){
  const L=LV; if(LVSOLVER){ LVSOLVER.stop(); LVSOLVER=null; }
  if(L.solve){ L.solved=true; levelHUD(); return; }          // replaying the same board: already known
  const layout=L.layout;
  const msg={cards:layout.map(c=>({r:c.r,s:c.s})), pts:SCORING[settings.scoring], seed:layout.map((c,i)=>i), fixed:layout.map((c,i)=>!!L.locks[i])};
  LVSOLVER=runSolver(msg,function(m){
    if(LV!==L || !m.done) return;
    LVSOLVER=null; L.solve={score:m.score, raw:m.grid.map(i=>layout[i])};
    L.max=m.score; L.target=Math.ceil(L.pct*L.max); L.solved=true; levelHUD();
    if(L.onSolved){ const f=L.onSolved; L.onSolved=null; f(); }
  });
}
function levelSetup(opts){
  if(LVSOLVER){ LVSOLVER.stop(); LVSOLVER=null; }
  const n=opts.n || (opts.same&&LV?LV.n:(LV&&!opts.top?LV.n:lvUnlocked()));
  if(!(opts.same && LV && LV.n===n)) LV=levelDeal(n);
  LV.result=null; LV.onSolved=null;
  if(LV.solve){ LV.max=LV.solve.score; LV.target=Math.ceil(LV.pct*LV.max); }
  grid=LV.locks.slice(); queue=LV.order.slice().reverse(); current=queue.pop();
  levelSolve();
}
function levelHUD(){
  if(!isLevels()||!LV) return;
  const total=computeLines(grid).total, el=document.getElementById("psBest");
  if(!el) return;
  el.innerHTML='Target <b>'+(LV.target==null?'…':LV.target)+'</b>';
  el.className='best goal'+(LV.target!=null && total>=LV.target?' ahead':'');
  if(!over && !(viewGrid()!==grid)) document.getElementById("psPlace").textContent=BOT.on?(settings.botAuto?"The bot is playing":"Tap Next card"):("Level "+LV.n+(LV.k?" · "+LV.k+" pre-filled":(levelClock(LV.n)!=="off"?" · Blitz":"")));
}
// stars: 1 at the target, 2 at +5 points of percentage, 3 at +10
function levelJudge(total){
  const L=LV, max=Math.max(L.max||0,total), pct=max?total/max:0;
  const stars=botTouched?0:(pct>=L.pct+.10?3:pct>=L.pct+.05?2:total>=L.target?1:0);
  const P=lvProg(), R=P[settings.scoring]; let unlocked=false;
  if(stars>0 && levelClock(L.n)!=="off") NG._earn("clock");
  if(stars>0){ R.stars[L.n]=Math.max(R.stars[L.n]||0,stars); if(R.level===L.n){ R.level=L.n+1; unlocked=true; } lvSave(P);
    if(stars===3) NG._earn("stars3"); if(L.n>=5) NG._earn("lv5"); if(L.n>=10) NG._earn("lv10"); }
  L.result={total, max, pct, stars, cleared:stars>0, unlocked};
  // the best board these cards make (respecting the locks) is the end-of-game "Best board" too
  if(L.solve) SOLVE={key:solveKey(), done:true, runs:1, max:1, agree:1, score:L.solve.score, grid:alignToMine(L.solve.raw)};
  refreshSolveUI();
}
function levelPlay(n, same){ closeOverlay(); if(!isLevels()){ settings.mode="levels"; persist(); } newGame({n:n, same:!!same}); }
function setMode(m){ settings.mode=m; persist(); closeOverlay(); newGame({top:true}); }
function stars(n){ let h=''; for(let i=0;i<3;i++) h+=i<n?'<b>★</b>':'★'; return h; }
function openLevels(){
  const R=lvProg()[settings.scoring], top=R.level, sys=settings.scoring==="american"?"American":"English";
  let rows='';
  for(let n=1;n<=Math.max(top,3);n++){ const lock=n>top, st=R.stars[n]||0;
    rows+='<li class="'+(lock?'lock':'')+'"><span class="ln">'+n+'</span><span class="ld">Score '+Math.round(levelPct(n)*100)+'% of the best board'+(LV_LOCKS[n-1]?' · '+LV_LOCKS[n-1]+' pre-filled':'')+(levelClock(n)==="shot"?' · Blitz, 8 s a card':(levelClock(n)==="board"?' · Blitz, 90 s board':''))+(n>=4?' · no undo':'')+'</span><span class="ls">'+stars(st)+'</span>'
      +(lock?'':'<button class="btn sm'+(n===top?'':' sec')+'" onclick="levelPlay('+n+')">'+(st?'Replay':'Play')+'</button>')+'</li>'; }
  openPanel('<button class="btn sec sm close" onclick="closeOverlay()">✕</button><h2>Levels</h2><p class="muted" style="margin-top:0;">'+sys+' scoring. Clear a level to open the next; stars at the target, +5% and +10%.</p><ul class="lvlist">'+rows+'</ul>',"levels");
}

/* ============================================================
   THE CLOCK (v209). Shot clock: 8 s for each card; time out and it goes into a random open square.
   Board clock: 90 s for all 25; at zero the rest drop into random squares. It runs only while you
   can play: it pauses for any open panel, a hidden app, a card in flight, the bot, and the first
   moments of each deal. A ring drains around the tray card; the last 3 s (shot) or 10 s (board)
   turn it red with a tick each second. No undo with a clock on.
   ============================================================ */
const SHOT_MS=8000, BOARD_MS=90000, GRACE_MS=550;
let CLOCK={kind:"off", left:0, total:0, last:0, grace:0, raf:0, dumping:false, lastSec:-1};
function clockKind(){ return isLevels() ? (LV?levelClock(LV.n):"off") : (settings.clock||"off"); }
function clockReset(){ cancelAnimationFrame(CLOCK.raf);
  const k=clockKind(); CLOCK={kind:k, left:k==="shot"?SHOT_MS:BOARD_MS, total:k==="shot"?SHOT_MS:BOARD_MS, last:0, grace:performance.now()+GRACE_MS+300, raf:0, dumping:false, lastSec:-1};
  if(k!=="off") CLOCK.raf=requestAnimationFrame(clockTick); }
function clockStop(){ cancelAnimationFrame(CLOCK.raf); CLOCK.raf=0; }
function clockPaused(now){ return over || !current || BOT.on || ANIMATING || CLOCK.dumping || !!curOverlay.kind || document.hidden || now<CLOCK.grace || VIEW!=="mine"; }
function clockTick(now){
  if(CLOCK.kind==="off") return;
  const dt=CLOCK.last?Math.min(100,now-CLOCK.last):0; CLOCK.last=now;
  if(!clockPaused(now)){
    CLOCK.left=Math.max(0,CLOCK.left-dt);
    const warn=CLOCK.kind==="shot"?3000:10000, sec=Math.ceil(CLOCK.left/1000);
    if(CLOCK.left<=warn && CLOCK.left>0 && sec!==CLOCK.lastSec){ CLOCK.lastSec=sec; NG.snd("tick",0,sec<=3?7:0); NG.hap(1,0,"light"); }
    if(CLOCK.left<=0){ clockDraw(); clockOut(); return; }
  }
  clockDraw(); CLOCK.raf=requestAnimationFrame(clockTick); }
function clockDraw(){
  const r=document.querySelector("#psCurrent .ngclock rect"); const warn=CLOCK.kind==="shot"?3000:10000;
  if(r){ r.style.strokeDashoffset=(100*(1-CLOCK.left/CLOCK.total)).toFixed(2); r.parentNode.classList.toggle("warn",CLOCK.left<=warn); }
  if(CLOCK.kind==="board"){ const pr=document.getElementById("psProg"); if(pr && !over){ const t=Math.ceil(CLOCK.left/1000);
    pr.innerHTML='<span class="ngtime'+(CLOCK.left<=warn?' warn':'')+'">'+Math.floor(t/60)+':'+String(t%60).padStart(2,"0")+'</span> · Card '+(placed()-((isLevels()&&LV)?LV.k:0)+1)+' of '+(25-((isLevels()&&LV)?LV.k:0)); } } }
function clockRingHTML(){ if(CLOCK.kind==="off"||!current) return "";
  return '<svg class="ngclock" viewBox="0 0 100 140" preserveAspectRatio="none" aria-hidden="true"><rect x="3" y="3" width="94" height="134" rx="14" pathLength="100"/></svg>'; }
function randomEmpty(){ const e=[]; grid.forEach((c,i)=>{ if(!c) e.push(i); }); return e[(Math.random()*e.length)|0]; }
function clockOut(){
  NG.cancelDrag(); NG.timeUp(CLOCK.kind==="shot"?"Time!":"Time's up");
  if(CLOCK.kind==="shot"){ place(randomEmpty()); return; }   // place() resets the shot clock for the next card
  CLOCK.dumping=true; render();
  (function next(){ if(over||!current){ CLOCK.dumping=false; return; } place(randomEmpty()); setTimeout(next,190); })();
}
function setClock(k){ settings.clock=k; persist(); closeOverlay(); newGame(); }
function clockBests(){ try{ return JSON.parse(localStorage.getItem("pokersquares.clockbest"))||{}; }catch(e){ return {}; } }

/* ---- flow ---- */
// Sound is best-effort: no sfx.js, no noise, no error.
function sfx(n){ if(window.SFX) SFX.play(n); }
function newGame(opts){
  sfx('shuffle');
  lastMove=null; over=false;
  VIEW="mine"; stopSolve(); SOLVE=null;
  botStop(); botTouched=false;
  if(isLevels()) levelSetup(opts||{});
  else { if(LVSOLVER){ LVSOLVER.stop(); LVSOLVER=null; } LV=null; grid=new Array(25).fill(null); queue=shuffle(makeDeck()); current=queue.pop(); }
  NG.reset(); clockReset(); render();
}
function undoAllowed(){ return clockKind()==="off" && (!isLevels() || !LV || LV.n<=3); }
function placed(){ return grid.reduce((n,c)=>n+(c?1:0),0); }
function place(i){
  if(over||!current||grid[i]) return;
  const from=document.querySelector('#psCurrent .card'), fromR=ngFromRect||(from?from.getBoundingClientRect():null); ngFromRect=null;
  grid[i]=current;
  sfx('place');
  lastMove={i, card:current, was:i};
  current = (placed()<25 && queue.length) ? queue.pop() : null;   // a full board leaves the tray empty
  if(CLOCK.kind==="shot"){ CLOCK.left=SHOT_MS; CLOCK.lastSec=-1; CLOCK.grace=performance.now()+GRACE_MS; }   // a fresh 8 s for the next card
  if(placed()===25){ finish(true); } else { render(i); }
  dealFx(i, fromR);
}
/* ---- v201: the card flies from the tray to its square; a line it finishes sweeps and calls out ---- */
function reduceMotion(){ return !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches); }
function dealFx(i, fromR){
  const cell=document.querySelector('#psboard .pscell[data-i="'+i+'"]');
  const done=[]; const r=Math.floor(i/5), c=i%5;
  [["row",r],["col",c]].forEach(function(l){
    const cards=lineIdx(l[0],l[1]).map(x=>grid[x]);
    if(cards.every(Boolean)) done.push({type:l[0], idx:l[1], h:scoreHand(cards)});
  });
  const user=!ngByBot;
  function landed(){ NG.land(i,user); done.forEach(function(d,k){ setTimeout(function(){ lineFx(d); }, k*380); }); }
  if(!cell || !fromR || reduceMotion() || !document.body.animate){ landed(); return; }
  NG.snd('whoosh', NG.panOfCol(i%5));
  const to=cell.getBoundingClientRect();
  const f=document.createElement("div"); f.className="flycard deal"; f.innerHTML=cell.innerHTML;
  Object.assign(f.style,{left:to.left+"px", top:to.top+"px", width:to.width+"px", height:to.height+"px"});
  document.body.appendChild(f); cell.style.visibility="hidden";
  const sx=fromR.width/to.width, sy=fromR.height/to.height;
  const dx=(fromR.left+fromR.width/2)-(to.left+to.width/2), dy=(fromR.top+fromR.height/2)-(to.top+to.height/2);
  // v204: the card rises off the tray, arcs over the board with its shadow growing, and settles
  const lift=Math.min(60, 18+Math.hypot(dx,dy)*.12), sw=dx>0?-1:1;
  const a=f.animate([
    {transform:'translate('+dx+'px,'+dy+'px) scale('+sx+','+sy+') rotate(-4deg)', boxShadow:'0 6px 14px rgba(0,0,0,.45)'},
    {transform:'translate('+(dx*.45)+'px,'+(dy*.45-lift)+'px) scale('+((sx+1)/2*1.12)+','+((sy+1)/2*1.12)+') rotate('+(sw*6)+'deg)', boxShadow:'0 26px 34px rgba(0,0,0,.4)', offset:.45},
    {transform:'translate(0,-3px) scale(1.04) rotate(0deg)', boxShadow:'0 8px 14px rgba(0,0,0,.45)', offset:.86},
    {transform:'translate(0,0) scale(1) rotate(0deg)', boxShadow:'0 2px 5px rgba(0,0,0,.45)'}
  ],{duration:360, easing:'cubic-bezier(.3,.7,.3,1)'});
  a.onfinish=function(){ f.remove();
    const now=document.querySelector('#psboard .pscell[data-i="'+i+'"]');   // a re-render may have replaced it
    if(now){ now.style.visibility=""; now.classList.remove("just"); void now.offsetWidth; now.classList.add("just"); }
    landed(); };
}
function lineFx(d){
  const h=d.h, t=TIER[h.key], idxs=lineIdx(d.type,d.idx);
  const els=idxs.map(x=>document.querySelector('#psboard .pscell[data-i="'+x+'"]')).filter(Boolean);
  if(els.length<5) return;
  if(h.pts>0) els.forEach(function(el,k){ el.classList.remove("sweep"); void el.offsetWidth; el.style.setProperty("--d",(k*45)+"ms"); el.classList.add("sweep");
    setTimeout(function(){ el.classList.remove("sweep"); }, 700+k*45); });
  const a=els[0].getBoundingClientRect(), b=els[4].getBoundingClientRect();
  NG.clearCalls();   // a made hand replaces any draw callout still up
  const call=document.createElement("div"); call.className="pscall t"+t;
  call.innerHTML = h.pts>0 ? h.name+'<b>+'+h.pts+'</b>' : 'No hand';
  call.style.left=((a.left+b.right)/2)+"px"; call.style.top=((a.top+b.bottom)/2)+"px";
  document.body.appendChild(call); setTimeout(function(){ call.remove(); }, 1300);
  if(t>=4) sfx('win'); else if(t===3) { sfx('good'); setTimeout(function(){ sfx('chip'); }, 180); }
  else if(t===2) sfx('good'); else if(t===1) sfx('chip');
  NG.lineBurst(d, els, t);
}
function undo(){
  if(!lastMove || ANIMATING || !undoAllowed()) return;
  VIEW="mine";
  sfx('select');
  if(current) queue.push(current);   // send the un-placed next card back
  current=lastMove.card;
  grid[lastMove.i]=null;
  const back=lastMove.i;
  lastMove=null; over=false;
  NG.quiet(); render();
}
function finish(fromPlace){
  over=true; VIEW="mine"; clockStop(); CLOCK.dumping=false;
  const {total}=computeLines(grid);
  if(isLevels() && LV){   // a level: judge it against the target (waiting for the search if it's still running)
    botStop(); sfx('good'); render(); NG.trophies(total);
    const L=LV, go=function(){ if(LV!==L||!over) return; levelJudge(total); if(L.result.cleared) sfx('win'); openResults(total); };
    const ready=function(){ if(L.solved) go(); else L.onSolved=go; };
    if(fromPlace) NG.tally(grid, ready); else ready();
    return;
  }
  startSolve();
  botStop();
  const timed=CLOCK.kind!=="off"; var beatBest=false;
  if(timed){ if(!botTouched){ const B=clockBests(), key=CLOCK.kind+":"+settings.scoring; if(total>(B[key]||0)){ B[key]=total; beatBest=true; try{ localStorage.setItem("pokersquares.clockbest",JSON.stringify(B)); }catch(e){} } } }
  else {
  if(!botTouched){ const k=settings.scoring, S=loadStats(); S[k]=S[k]||{n:0,sum:0}; S[k].n++; S[k].sum+=total; saveStats(S); }
  beatBest = !botTouched && total>best;   // a new personal best gets the bigger fanfare; bot boards never count
  if(beatBest){ best=total; }
  }
  sfx(beatBest ? 'win' : 'good');
  persist();
  render();
  NG.trophies(total);
  if(fromPlace){ NG.tally(grid, function(){ openResults(total); }); }   // the last callouts, then each scoring line lights in turn
  else openResults(total);
  HS.refresh();
}

/* ---- render ---- */
function bigCardHTML(c){
  if(!c) return '<div class="card back"></div>';
  return '<div class="card" style="color:'+suitColor(c.s)+'"><span class="rank">'+rankStr(c.r)+'</span><span class="pip">'+SUITS[c.s]+'</span><span class="rankb">'+rankStr(c.r)+'</span></div>';
}
// how loud a hand is, for the chip's glow and the callout (v201)
const TIER={high:0,pair:1,twopair:1,three:2,straight:2,flush:2,full:3,four:3,sflush:4,royal:4};
function chipHTML(h){
  if(!h) return '<div class="psscore"><span class="dot">·</span></div>';
  return '<div class="psscore t'+TIER[h.key]+(h.pts>0?' has':'')+'" title="'+h.name+' · '+h.pts+'"><span class="ab">'+ABBR[h.key]+'</span><span class="pts">'+h.pts+'</span></div>';
}
function miniHTML(card){
  return '<span class="psmini" style="color:'+suitColor(card.s)+'"><span class="r">'+rankStr(card.r)+'</span><span class="s">'+SUITS[card.s]+'</span></span>';
}
/* Render ANY 25-card grid read-only (for viewing a leaderboard entry's board). Reuses the
   live board's cells and chips but touches no game state - computeLines takes the grid. */
function viewBoardHTML(cards, sys){
  const keep=settings.scoring; settings.scoring=sys;
  let lines; try{ lines=computeLines(cards); } finally{ settings.scoring=keep; }
  const {rows,cols,total}=lines;
  let html="";
  for(let r=0;r<5;r++){
    for(let c=0;c<5;c++){ const card=cards[r*5+c];
      html+=card?('<div class="pscell filled">'+miniHTML(card)+'</div>'):'<div class="pscell empty"></div>'; }
    html+=chipHTML(rows[r]);
  }
  for(let c=0;c<5;c++) html+=chipHTML(cols[c]);
  html+='<div class="psscore corner"><span class="ab">TOT</span><span class="pts">'+total+'</span></div>';
  return {html:'<div class="psboard ro">'+html+'</div>', total};
}
/* Best board for an arbitrary 25-card deal, computed on demand (synchronous, short budget).
   Same engine as the post-game solver; a few annealing runs plus a deterministic polish land
   on the optimum for a 25-card deal well within a frame budget. */
function bestBoardFor(cards, sys){
  const S=makeSolver(cards.map(c=>({r:c.r,s:c.s})), SCORING[sys]);
  const T0=2*Math.max(SCORING[sys].flush, SCORING[sys].straight), T1=T0/100;
  let best=S.polish(cards.map((c,i)=>i));
  for(let run=0; run<6; run++){ const a=S.anneal(300000,T0,T1), p=S.polish(a.grid); if(p.score>best.score) best=p; }
  return {grid:best.grid.map(i=>cards[i]), score:best.score};
}
/* ---- the bot: Watch the bot ----------------------------------------------------------------
   Plays the deal it's given one card at a time, the same way you do: it sees the board, the card
   in the tray and which cards are still unseen - never the order of the deck. For each empty
   square it estimates how much the card there raises the expected final value of that square's
   row plus its column, and takes the best. A partial line is worth the most of: its flush odds
   (the suit cards still to come, shared with the other lines chasing that suit), its straight
   odds (the ranks it still needs), and what its ranks make now plus their likeliest upgrades.
   Weights tuned offline over hundreds of deals: about 84 a board American and 37 English, against
   about 14 / 8 for placing at random. Auto plays a card every 1.5 s; off, Next card plays one.
   A board the bot placed any card on doesn't count toward your best or the high-score board. */
// Poker Squares bot: places each card as it comes, never looking at the deck order.
// lineVal() estimates a partial row/column's final worth from the unseen cards;
// the bot picks the square that most raises (row value + column value).
function makeBot(PTS, W){
  W=Object.assign({empty:0.0, second:0.35, flushW:1, straightW:1, rankW:1, newPair:0.25, share:1},W||{});
  const C=[]; for(let n=0;n<=52;n++){ C[n]=[1]; for(let k=1;k<=n;k++) C[n][k]=(C[n-1]?(C[n-1][k-1]||0)+(C[n-1][k]||0):0); }
  const comb=(n,k)=>(k<0||k>n)?0:C[n][k];
  // P(at least m of the a "good" cards turn up among the next R of D unseen)
  function atLeast(D,a,R,m){ if(m<=0) return 1; if(a<m||R<m) return 0; let p=0, tot=comb(D,R);
    for(let x=m;x<=Math.min(a,R);x++) p+=comb(a,x)*comb(D-a,R-x); return p/tot; }
  function made(cnt){ const c=Object.values(cnt).sort((a,b)=>b-a);
    if(c[0]>=4) return PTS.four; if(c[0]===3&&c[1]>=2) return PTS.full; if(c[0]===3) return PTS.three;
    if(c[0]===2&&c[1]===2) return PTS.twopair; if(c[0]===2) return PTS.pair; return 0; }
  function exact(cards){ // complete line
    const rs=cards.map(c=>c.r).sort((a,b)=>a-b), fl=cards.every(c=>c.s===cards[0].s), u=new Set(rs).size;
    let st=false; if(u===5){ if(rs[4]-rs[0]===4) st=true; else if(rs[0]===2&&rs[3]===5&&rs[4]===14) st=true; }
    const cnt={}; rs.forEach(r=>cnt[r]=(cnt[r]||0)+1);
    if(st&&fl) return rs[0]===10?PTS.royal:PTS.sflush; const m=made(cnt);
    if(m>=PTS.full && m>PTS.flush) return m; if(fl) return Math.max(PTS.flush,m); if(st) return Math.max(PTS.straight,m); return m; }
  function lineVal(cards, ctx){
    const n=cards.length, k=5-n; if(k===0) return exact(cards);
    if(n===0) return W.empty;
    const {D,R,suit,rank}=ctx;
    // flush draw
    let fv=0; if(cards.every(c=>c.s===cards[0].s)){ const s0=cards[0].s, rivals=Math.max(0,(ctx.chase[s0]||0)-(ctx.self===s0?1:0));
      const a=Math.round(suit[s0]/(1+W.share*rivals)); fv=W.flushW*atLeast(D,a,R,k)*PTS.flush; }
    // straight draw: best window containing every rank
    let sv=0; const rs=cards.map(c=>c.r);
    if(new Set(rs).size===n){
      for(let lo=1;lo<=10;lo++){ const win=[]; for(let r=lo;r<lo+5;r++) win.push(r===1?14:r);
        if(!rs.every(r=>win.includes(r))) continue;
        let p=1; win.forEach(r=>{ if(!rs.includes(r)) p*=atLeast(D,rank[r],R,1); });
        sv=Math.max(sv,p); }
      sv*=W.straightW*PTS.straight; }
    // ranks: what's made now plus the best upgrades
    const cnt={}; rs.forEach(r=>cnt[r]=(cnt[r]||0)+1); const base=made(cnt); const gains=[];
    Object.keys(cnt).forEach(r=>{ const c2=Object.assign({},cnt); c2[r]++; const g=made(c2)-base; if(g>0) gains.push(g*atLeast(D,rank[r],R,1)); });
    if(k>=2) gains.push(W.newPair*PTS.pair);
    gains.sort((a,b)=>b-a);
    const rv=base+W.rankW*((gains[0]||0)+(k>=2?W.second*(gains[1]||0):0));
    return Math.max(fv,sv,rv)+0.15*Math.min(fv,rv);
  }
  const L=[]; for(let i=0;i<5;i++){ L.push([0,1,2,3,4].map(c=>i*5+c)); } for(let j=0;j<5;j++){ L.push([0,1,2,3,4].map(r=>r*5+j)); }
  return function pick(grid, card, unseen){ // unseen: cards not on the board and not `card`
    const suit=[0,0,0,0], rank=new Array(15).fill(0); unseen.forEach(c=>{ suit[c.s]++; rank[c.r]++; });
    const empties=[]; grid.forEach((c,i)=>{ if(!c) empties.push(i); });
    const chase=[0,0,0,0];
    for(const l of L){ const cs=l.map(x=>grid[x]).filter(Boolean); if(cs.length>=1&&cs.length<5&&cs.every(c=>c.s===cs[0].s)) chase[cs[0].s]++; }
    const ctx={D:unseen.length, R:empties.length-1, suit, rank, chase, self:-1};
    let best=-1e9, bi=empties[0];
    for(const i of empties){ let d=0;
      for(const l of L){ if(!l.includes(i)) continue;
        const before=l.map(x=>grid[x]).filter(Boolean), after=before.concat([card]);
        const sf=cs=>(cs.length&&cs.every(c=>c.s===cs[0].s))?cs[0].s:-1;
        ctx.self=sf(before); const vb=lineVal(before,ctx); ctx.self=sf(after); const va=lineVal(after,ctx); ctx.self=-1;
        d+=va-vb; }
      if(d>best+1e-9){ best=d; bi=i; } }
    return bi; };
}
const BOT_W={flushW:1, rankW:2.2, share:0.5, second:0.7};

const BOT_MS=1500;
let BOT={on:false, t:null, fns:{}}, botTouched=false;
function botPickFn(){ const k=settings.scoring; return BOT.fns[k]||(BOT.fns[k]=makeBot(SCORING[k], BOT_W)); }
function unseenCards(){ const seen=new Set(grid.filter(Boolean).map(cardKey)); if(current) seen.add(cardKey(current));
  return makeDeck().filter(c=>!seen.has(cardKey(c))); }
function botMove(){ if(!BOT.on||over||!current||ANIMATING) return; botTouched=true; ngByBot=true; try{ place(botPickFn()(grid, current, unseenCards())); } finally{ ngByBot=false; } }

  if(!BOT.on||over||!settings.botAuto) return;
  BOT.t=setTimeout(function(){ if(curOverlay.kind){ botSchedule(); return; }   // waits while a panel is open
    botMove(); botSchedule(); }, BOT_MS); }

let lastShownCard="", shownTotal=0, rollTok=0;
// the score rolls up to its new value (and pops) rather than jumping; the best-board flight counts it itself
function rollScore(to){
  const el=document.getElementById("psTotal"); const tok=++rollTok;
  if(ANIMATING){ return; }
  const from=shownTotal; shownTotal=to;
  if(from===to || reduceMotion()){ el.textContent=to; return; }
  if(to>from){ el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }
  const t0=performance.now(), dur=Math.min(700, 250+Math.abs(to-from)*6);
  (function tick(now){ if(tok!==rollTok) return; const k=Math.min(1,(now-t0)/dur);
    el.textContent=Math.round(from+(to-from)*(1-Math.pow(1-k,3))); if(k<1) requestAnimationFrame(tick); })(t0);
}
function render(justIdx){
  const g=viewGrid(), showBest=g!==grid;
  const {rows,cols,total}=computeLines(g);
  // tray
  document.getElementById("psCurrent").innerHTML=bigCardHTML(current)+clockRingHTML();
  document.getElementById("psCurrent").style.display=current?"":"none";   // board full: no next card, give the room back
  const n=placed();
  document.getElementById("psPlace").textContent = showBest ? "Best board" : (over ? (botTouched?"The bot's board":"Board complete") : (BOT.on ? (settings.botAuto?"The bot is playing":"Tap Next card") : "Tap an empty square"));
  const k0=(isLevels()&&LV)?LV.k:0;
  document.getElementById("psProg").textContent  = showBest ? ("You scored "+computeLines(grid).total) : (over ? "25 of 25 placed" : ("Card "+(n-k0+1)+" of "+(25-k0)));
  rollScore(total);
  const m=document.getElementById("psMeter");
  if(m){ let mh=""; for(let k=0;k<25;k++) mh+='<i class="'+(k<n?'on':(k===n&&!over&&!showBest?'now':''))+'"></i>'; m.innerHTML=mh; m.style.display=showBest?"none":""; }
  const ck=current?(current.r+"/"+current.s):"";
  if(ck && ck!==lastShownCard){ const cc=document.querySelector('#psCurrent .card'); if(cc) cc.classList.add("dealin"); }
  lastShownCard=ck;
  const bestEl=document.getElementById("psBest");
  if(isLevels()&&LV) levelHUD();
  else { bestEl.textContent="Best "+best; bestEl.className='best'; }
  // board (6x6: 25 cells + 5 row chips + 5 col chips + total corner)
  let html="";
  for(let r=0;r<5;r++){
    for(let c=0;c<5;c++){
      const idx=r*5+c, card=g[idx];
      if(card){
        const lk=(!showBest && isLevels() && LV && LV.locks[idx])?' locked':'';
        html+='<div class="pscell filled'+lk+(justIdx===idx?' just':'')+'" data-i="'+idx+'">'+miniHTML(card)+'</div>';
      }else{
        const live=(!over&&current&&!BOT.on&&!CLOCK.dumping)?' live':'';
        html+='<div class="pscell empty'+live+'" data-i="'+idx+'"'+(live?(' onclick="place('+idx+')"'):'')+'></div>';
      }
    }
    html+=chipHTML(rows[r]);

  for(let c=0;c<5;c++) html+=chipHTML(cols[c]);
  html+='<div class="psscore corner"><span class="ab">TOT</span><span class="pts">'+total+'</span></div>';
  const board=document.getElementById("psboard");
  board.innerHTML=html; board.classList.toggle("isbest",showBest);
  renderBestBar();
  // tips
  const fp=SCORING[settings.scoring].flush;
  document.getElementById("psTips").innerHTML = settings.tipsOn
    ? '<div class="tip-block"><b>Flushes are your friend.</b> Funnel one suit down a single row or column — a flush is '+fp+' pts and far easier to land than a straight.</div>'
     +'<div class="tip-block"><b>Every square feeds two hands.</b> A card lives in one row and one column at once, so the corners and centre are worth the most thought.</div>'
    : "";
  // undo availability
  const undoBtn=document.getElementById("psUndo");
  undoBtn.disabled = !lastMove || showBest || !undoAllowed();
  undoBtn.textContent = undoAllowed() ? "↩ Undo" : "No undo";
  renderBotBar();
  if(CLOCK.kind!=="off") clockDraw();
  NG.after(justIdx);
  fitPS();
}
// Never scroll the main screen: if the page is taller than the phone (small phone, or a big card
// size growing the tray's card), take the difference out of the board's cell height (v138).
function fitPS(){
  const root=document.documentElement, cell=document.querySelector('#psboard .pscell'); if(!cell) return;
  root.style.removeProperty('--cellh');
  let h=cell.getBoundingClientRect().height;
  for(let i=0;i<12;i++){ const over=root.scrollHeight-innerHeight; if(over<=0||h<=38) break;
    h=Math.max(38, Math.floor(h-Math.ceil(over/5)-1)); root.style.setProperty('--cellh', h+'px'); }
}
addEventListener('resize', function(){ try{ fitPS(); }catch(e){} });

function setScoring(s){ settings.scoring=s; persist(); if(isLevels()){ newGame({top:true}); openMenu(); return; } if(over){ VIEW="mine"; startSolve(); } render(); openMenu(); }

/* ============================================================
   BEST BOARD — "could these 25 cards have scored more?"
   After the 25th card a search rearranges the same cards for the
   highest total, then the cards fly to that layout and back.

   makeSolver() is the whole search and touches no DOM, so the same
   source runs in a Web Worker (built from a Blob, so it works offline)
   or, where workers are blocked, on the page between frames.
   Every 5-card subset of the 25 is scored once into a table; a line
   is then one lookup. Search = simulated annealing on card swaps,
   finished by trying every 2-swap and 3-cycle. It stops once two
   separate searches land on the same top score (or after 10 / 12s).
   Not a proof - on test deals it matched much longer searches about
   99% of the time. The player's own board seeds the search, so the
   "best" can never come out below what the player actually scored.
   ============================================================ */
// pure solver: cards [{r,s}] x25, pts table {key:pts} -> {grid:[25 idx into cards], score, runs, agree}
function makeSolver(cards, PTS, fixed){
  // fixed[i] true = the card at i stays put (a level's pre-filled squares); only the rest move
  const FREE=[]; for(let i=0;i<25;i++) if(!(fixed&&fixed[i])) FREE.push(i); const NF=FREE.length;
  // score every 5-subset of the 25 once; line score = lookup
  const N=25, C=[];
  for(let n=0;n<=N;n++){C[n]=[];for(let k=0;k<=5;k++)C[n][k]=k===0?1:(n===0?0:C[n-1][k-1]+(C[n-1][k]||0));}
  const T=new Int16Array(53130);
  // combinadic index of five distinct cell values, sorted by a 9-comparator network (no allocation)
  const C1=C.map(r=>r[1]),C2=C.map(r=>r[2]),C3=C.map(r=>r[3]),C4=C.map(r=>r[4]),C5=C.map(r=>r[5]);
  function key5(a,b,c,d,e){ let t;
    if(a>b){t=a;a=b;b=t;} if(d>e){t=d;d=e;e=t;} if(c>e){t=c;c=e;e=t;} if(c>d){t=c;c=d;d=t;}
    if(a>d){t=a;a=d;d=t;} if(a>c){t=a;a=c;c=t;} if(b>e){t=b;b=e;e=t;} if(b>d){t=b;b=d;d=t;} if(b>c){t=b;b=c;c=t;}
    return C1[a]+C2[b]+C3[c]+C4[d]+C5[e];
  }
  function ev(h){
    const rs=h.map(c=>c.r).sort((a,b)=>a-b), fl=h.every(c=>c.s===h[0].s);
    const u=new Set(rs).size; let st=false;
    if(u===5) st = rs[4]-rs[0]===4 || (rs[0]===2&&rs[3]===5&&rs[4]===14);
    const cnt={}; rs.forEach(r=>cnt[r]=(cnt[r]||0)+1); const cs=Object.values(cnt).sort((a,b)=>b-a);
    let k;
    if(st&&fl&&rs[0]===10) k="royal"; else if(st&&fl) k="sflush"; else if(cs[0]===4) k="four";
    else if(cs[0]===3&&cs[1]===2) k="full"; else if(fl) k="flush"; else if(st) k="straight";
    else if(cs[0]===3) k="three"; else if(cs[0]===2&&cs[1]===2) k="twopair"; else if(cs[0]===2) k="pair"; else k="high";
    return PTS[k];
  }
  for(let a=0;a<N;a++)for(let b=a+1;b<N;b++)for(let c=b+1;c<N;c++)for(let d=c+1;d<N;d++)for(let e=d+1;e<N;e++)
    T[C[a][1]+C[b][2]+C[c][3]+C[d][4]+C[e][5]]=ev([cards[a],cards[b],cards[c],cards[d],cards[e]]);
  const L=[]; for(let i=0;i<5;i++){L.push([0,1,2,3,4].map(k=>i*5+k));} for(let j=0;j<5;j++){L.push([0,1,2,3,4].map(k=>k*5+j));}
  function line(g,l){ const x=L[l]; return T[key5(g[x[0]],g[x[1]],g[x[2]],g[x[3]],g[x[4]])]; }
  function total(g){ let t=0; for(let l=0;l<10;l++) t+=line(g,l); return t; }
  // xorshift32 - faster than Math.random and seedable for tests
  let seed=(Math.random()*4294967295)>>>0||1;
  function rnd(){ seed^=seed<<13; seed^=seed>>>17; seed^=seed<<5; return (seed>>>0)/4294967296; }
  function anneal(iters,T0,T1,g){
    if(!g){ g=[...Array(25).keys()]; for(let i=NF-1;i>0;i--){ const j=(rnd()*(i+1))|0, x=g[FREE[i]]; g[FREE[i]]=g[FREE[j]]; g[FREE[j]]=x; } }
    const ls=new Int32Array(10); let cur=0; for(let l=0;l<10;l++){ls[l]=line(g,l);cur+=ls[l];}
    let best=cur, bg=g.slice();
    const BLK=1000, k=Math.pow(T1/T0,BLK/iters); let temp=T0;
    for(let it=0;it<iters;it++){
      if(it%BLK===0 && it) temp*=k;
      if(NF<2) break;
      const ai=(rnd()*NF)|0; let bi=(rnd()*(NF-1))|0; if(bi>=ai)bi++; const a=FREE[ai], b=FREE[bi];
      const ra=(a/5)|0, ca=5+a%5, rb=(b/5)|0, cb=5+b%5;
      const t=g[a]; g[a]=g[b]; g[b]=t;
      const n1=line(g,ra), n2=line(g,ca), n3=rb!==ra?line(g,rb):0, n4=cb!==ca?line(g,cb):0;
      const d=n1-ls[ra]+n2-ls[ca]+(rb!==ra?n3-ls[rb]:0)+(cb!==ca?n4-ls[cb]:0);
      if(d>=0 || rnd()<Math.exp(d/temp)){
        ls[ra]=n1; ls[ca]=n2; if(rb!==ra)ls[rb]=n3; if(cb!==ca)ls[cb]=n4; cur+=d;
        if(cur>best){best=cur; bg=g.slice();}
      } else { g[b]=g[a]; g[a]=t; }
    }
    return {score:best, grid:bg};
  }
  // deterministic finish: best-improvement over every 2-swap and 3-cycle until none helps
  function polish(g){
    g=g.slice(); let cur=total(g), improved=true;
    while(improved){ improved=false;
      for(let fi=0;fi<NF&&!improved;fi++)for(let fj=fi+1;fj<NF&&!improved;fj++){ const a=FREE[fi], b=FREE[fj];
        let t=g[a];g[a]=g[b];g[b]=t; const v=total(g); if(v>cur){cur=v;improved=true;} else {g[b]=g[a];g[a]=t;}
        if(improved) break;
        for(let fk=0;fk<NF&&!improved;fk++){ const c=FREE[fk]; if(c===a||c===b) continue;
          const x=g[a],y=g[b],z=g[c]; g[a]=y;g[b]=z;g[c]=x; const w=total(g);
          if(w>cur){cur=w;improved=true;} else {g[a]=x;g[b]=y;g[c]=z;} }
      } }
    return {score:cur,grid:g};
  }
  function shuffle(a){for(let i=a.length-1;i>0;i--){const j=(rnd()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
  return {anneal,total,line,polish};
}

function solveRun(msg, post, isStopped){
  // shared by the worker and the main-thread fallback
  const S=makeSolver(msg.cards, msg.pts, msg.fixed);
  const T0=2*Math.max(msg.pts.flush, msg.pts.straight), T1=T0/100;
  const t0=Date.now();
  let best=S.polish(msg.seed), cnt=0, runs=0;
  const MAX=10, NEED=2, MIN=3, ITERS=1500000, BUDGET=12000;
  function one(){
    const a=S.anneal(ITERS,T0,T1), p=S.polish(a.grid); runs++;
    if(p.score>best.score){ best=p; cnt=1; } else if(p.score===best.score) cnt++;
    const done = (cnt>=NEED && runs>=MIN) || runs>=MAX || Date.now()-t0>BUDGET;
    post({done, runs, max:MAX, agree:cnt, score:best.score, grid:best.grid});
    return done;
  }
  return one;
}
function workerMain(){
  self.onmessage=function(e){ const one=solveRun(e.data, m=>self.postMessage(m)); while(!one()){} };
}

let VIEW="mine";      // which layout the full board shows: "mine" | "best"
let SOLVE=null;       // {key, done, runs, max, agree, score, grid:[cards]}
let SOLVER=null;      // live worker / fallback timer
let ANIMATING=false;

function viewGrid(){ return (over && VIEW==="best" && SOLVE && SOLVE.done && SOLVE.grid) ? SOLVE.grid : grid; }
function cardKey(c){ return c.r*4+c.s; }
function solveKey(){ return settings.scoring+":"+grid.map(cardKey).slice().sort((a,b)=>a-b).join(","); }
function stopSolve(){ if(!SOLVER) return; try{ SOLVER.stop(); }catch(e){} SOLVER=null; }

function startSolve(){
  const key=solveKey();
  if(SOLVE && SOLVE.key===key){ refreshSolveUI(); return; }   // same cards, same scoring (e.g. after an undo)
  stopSolve();
  const cards=grid.slice();                 // the search works on indices into this list
  SOLVE={key, done:false, runs:0, max:10, agree:0, score:computeLines(grid).total, grid:null};
  const msg={cards:cards.map(c=>({r:c.r,s:c.s})), pts:SCORING[settings.scoring], seed:cards.map((c,i)=>i)};
  const onMsg=function(m){
    if(!SOLVE || SOLVE.key!==key) return;
    SOLVE.runs=m.runs; SOLVE.max=m.max; SOLVE.agree=m.agree; SOLVE.score=m.score;
    if(m.done){ SOLVE.done=true; SOLVE.grid=alignToMine(m.grid.map(i=>cards[i])); SOLVER=null; }
    refreshSolveUI();
  };
  SOLVER=runSolver(msg,onMsg);
  refreshSolveUI();
}
function runSolver(msg,onMsg){
  let stop=null;
  try{
    const src=makeSolver.toString()+"\n"+solveRun.toString()+"\n("+workerMain.toString()+")();";
    const url=URL.createObjectURL(new Blob([src],{type:"text/javascript"}));
    const w=new Worker(url);
    w.onmessage=function(e){ onMsg(e.data); };
    w.onerror=function(ev){ ev.preventDefault(); w.terminate(); fallback(); };
    w.postMessage(msg);
    stop=function(){ w.terminate(); URL.revokeObjectURL(url); };
  }catch(e){ fallback(); }
  function fallback(){
    // one search per timeslice, so the page stays tappable between them
    let dead=false; const one=solveRun(msg,onMsg);
    setTimeout(function step(){ if(dead) return; if(!one()) setTimeout(step,30); },0);
    stop=function(){ dead=true; };
  }
  return {stop:function(){ if(stop) stop(); }};
}

/* The same board can be laid out 28,800 ways (shuffle the rows, shuffle the
   columns, flip the diagonal) without changing a single hand. Pick the one
   that leaves the most of the player's cards where they already are, so the
   animation shows only the moves that matter. */
function permsOf5(){ const out=[]; (function go(p,rest){ if(!rest.length){out.push(p);return;}
  rest.forEach((x,i)=>go(p.concat(x),rest.slice(0,i).concat(rest.slice(i+1)))); })([],[0,1,2,3,4]); return out; }
const PERMS5=permsOf5();
function alignToMine(B){
  const mine=grid.map(cardKey); let bestG=B, bestN=-1;
  for(let t=0;t<2;t++){
    const G=t? B.map((_,i)=>B[(i%5)*5+((i/5)|0)]) : B;
    const k=G.map(cardKey);
    // M[r*5+c][R*5+C]: would putting G's (R,C) at (r,c) keep the player's card there?
    const M=[]; for(let i=0;i<25;i++){ M.push([]); for(let j=0;j<25;j++) M[i].push(k[j]===mine[i]?1:0); }
    for(const p of PERMS5) for(const q of PERMS5){
      let n=0; for(let r=0;r<5;r++){ const Mr=r*5, pr=p[r]*5; for(let c=0;c<5;c++) n+=M[Mr+c][pr+q[c]]; }
      if(n>bestN){ bestN=n; const o=[]; for(let r=0;r<5;r++)for(let c=0;c<5;c++) o.push(G[p[r]*5+q[c]]); bestG=o; }
    }
  }
  return bestG;
}

function loadStats(){ try{ return JSON.parse(localStorage.getItem("pokersquares.stats"))||{}; }catch(e){ return {}; } }
function saveStats(S){ try{ localStorage.setItem("pokersquares.stats", JSON.stringify(S)); }catch(e){} }
// The stat tiles on the results screen: your score, the most these 25 cards could make (from the
// best-board search), your share of it, and your average board under this scoring.
function solveBoxHTML(){
  if(!SOLVE) return "";
  const mine=computeLines(grid).total, st=loadStats()[settings.scoring]||{n:0,sum:0};
  const done=SOLVE.done, max=done?Math.max(SOLVE.score,mine):null, pct=done&&max?Math.round(100*mine/max):null;
  const avg=botTouched?'—':(st.n?Math.round(st.sum/st.n):'—');
  const tile=(l,v)=>'<div><span>'+l+'</span><b>'+v+'</b></div>';
  const prog=done?pct:Math.max(6,Math.round(100*SOLVE.runs/SOLVE.max));
  return '<div class="stats">'+tile(botTouched?'Bot':'You',mine)+tile('Max',done?max:'…')+tile('Of max',done?pct+'%':'…')
    +tile(st.n&&!botTouched?'Avg · '+st.n:'Avg',avg)
    +'<div class="bar"><i style="width:'+prog+'%"></i></div></div>'
    +'<div class="stats-note">'+(!done?'Searching for the best board these 25 cards make…':(SOLVE.score<=mine?'🎯 That\'s the best board these cards make.':'Max is the best board these same 25 cards can make.'))+'</div>';
}
function renderBestBar(){ renderBestBar_(); try{ fitPS(); }catch(e){} }   // the bar appearing after a game can push the page; refit
function renderBestBar_(){
  const el=document.getElementById("psBestBar"); if(!el) return;
  if(!over || !SOLVE){ el.innerHTML=""; return; }
  const mine=computeLines(grid).total;
  const back='<button class="btn sm ngback" onclick="openResults(computeLines(grid).total)">‹ Results</button>';
  if(!SOLVE.done){ el.innerHTML='<div class="bbrow">'+back+'</div><div class="note">Searching for the best board…</div>'; return; }
  if(SOLVE.score<=mine){ el.innerHTML='<div class="bbrow">'+back+'</div><div class="note">🎯 Best possible board — nothing beats '+mine+'.</div>'; return; }
  el.innerHTML='<div class="bbrow">'+back+'<div class="seg"><button class="'+(VIEW==="mine"?"on":"")+'" onclick="showView(\'mine\')">Yours '+mine+'</button>'
    +'<button class="'+(VIEW==="best"?"on":"")+'" onclick="showView(\'best\')">✨ Best '+SOLVE.score+'</button></div></div>'
    +'<div class="note">'+(VIEW==="best"?"Same 25 cards, rearranged.":"Tap Best to watch the cards rearrange.")+'</div>';
}
function refreshSolveUI(){
  const box=document.getElementById("psSolveBox"); if(box) box.innerHTML=solveBoxHTML();
  const bb=document.getElementById("psBestBtn"); if(bb) bb.disabled=!(SOLVE&&SOLVE.done&&SOLVE.score>computeLines(grid).total);

/* ---- the move: every card that changes square lifts, spins and lands ---- */
function showView(v){
  if(ANIMATING || v===VIEW || !over || !SOLVE || !SOLVE.done) return;
  const fromG=viewGrid(), board=document.getElementById("psboard");
  const fromRects={}; board.querySelectorAll(".pscell[data-i]").forEach(el=>{ fromRects[el.dataset.i]=el.getBoundingClientRect(); });
  const fromTotal=computeLines(fromG).total;
  VIEW=v; render();
  const toG=viewGrid(), toTotal=computeLines(toG).total;
  const reduce=window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reduce || !board.animate) return;
  const where={}; fromG.forEach((c,i)=>{ where[cardKey(c)]=i; });
  const moves=[];
  board.querySelectorAll(".pscell[data-i]").forEach(el=>{
    const to=+el.dataset.i, from=where[cardKey(toG[to])];
    if(from!==to) moves.push({el,from,to});
  });
  if(!moves.length) return;
  ANIMATING=true; board.classList.add("anim");
  sfx('shuffle');
  // land in a wave from the top-left, but the longest flights leave first so they don't trail
  moves.sort((a,b)=>a.to-b.to);
  const STAG=Math.min(60, 1100/moves.length), DUR=760;
  let left=moves.length;
  moves.forEach((m,n)=>{
    const a=fromRects[m.from], b=m.el.getBoundingClientRect();
    m.el.classList.add("ghost");
    const f=document.createElement("div"); f.className="flycard"; f.innerHTML=m.el.innerHTML;
    Object.assign(f.style,{left:b.left+"px", top:b.top+"px", width:b.width+"px", height:b.height+"px"});
    document.body.appendChild(f);
    const dx=a.left-b.left, dy=a.top-b.top, spin=(n%2?-1:1)*360;
    const anim=f.animate([
      {transform:'translate('+dx+'px,'+dy+'px) rotate(0deg) scale(1)', offset:0},
      {transform:'translate('+(dx*.5)+'px,'+(dy*.5-28)+'px) rotate('+(spin*.55)+'deg) scale(1.32)', offset:.5},
      {transform:'translate(0,-4px) rotate('+spin+'deg) scale(1.06)', offset:.88},
      {transform:'translate(0,0) rotate('+spin+'deg) scale(1)', offset:1}
    ],{duration:DUR, delay:n*STAG, easing:'cubic-bezier(.45,.05,.25,1)', fill:'backwards'});
    anim.onfinish=function(){
      f.remove(); m.el.classList.remove("ghost");
      if(n%3===0) sfx('place');
      if(--left===0) landed();
    };
  });
  // count the score across while the cards are in the air
  const numEl=document.getElementById("psTotal"), span=DUR+STAG*moves.length, t0=performance.now();
  numEl.textContent=fromTotal;
  (function tick(now){ const k=Math.min(1,(now-t0)/span); numEl.textContent=Math.round(fromTotal+(toTotal-fromTotal)*k*k*(3-2*k));
    if(k<1 && ANIMATING) requestAnimationFrame(tick); })(t0);
  function landed(){
    ANIMATING=false; board.classList.remove("anim");
    numEl.textContent=toTotal; shownTotal=toTotal;
    board.querySelectorAll(".psscore").forEach(el=>el.classList.add("land"));
    sfx(v==="best"?'win':'select');
    renderBestBar();
  }
}
window.__PS={ get state(){ return {over,VIEW,SOLVE,ANIMATING,grid}; }, showView, startSolve, alignToMine,
  deal:function(cards){ grid=cards.slice(); queue=[]; current=null; lastMove=null; finish(); } };

/* ============================================================
   HIGH SCORES — one board everybody sees (v105)
   No backend: scores ride a public ntfy topic (the same relay Pull Tabs
   uses). ntfy only keeps 12 hours of messages, so every phone also keeps
   the whole board in localStorage and re-posts it as a 'board' message
   when the feed has none from the last 6 hours. As long as somebody opens
   Poker Squares now and then, the board carries forward; a phone that has
   been away just merges its copy back in when it returns.
   Each entry carries its 25 cards, and every phone re-scores them on the
   way in, so a typed-in "999" from the console doesn't make the board.
   American and English scoring keep separate top-10s.
   ============================================================ */
const HS=(function(){
  const RELAY="https://ntfy.envs.net/", TOPIC=(function(){ try{ return new URLSearchParams(location.search).get("hs")||"jtps-v1-scores"; }catch(e){ return "jtps-v1-scores"; } })(), TOP=10, CARRY_MS=6*3600*1000;
  const KB="pokersquares.board", KN="pokersquares.name", KP="pokersquares.pending", KD="pokersquares.posted";
  function load(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }
  function save(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
  let board=load(KB,{american:[],english:[]});
  if(!board.american) board.american=[]; if(!board.english) board.english=[];
  let pending=load(KP,[]), posted=load(KD,[]), status="", lastSync=0, mine=null, tab=null, syncing=null;

  const B36="0123456789abcdefghijklmnopqrstuvwxyz";
  function encCards(g){ return g.map(c=>{ const k=(c.r-2)*4+c.s; return B36[k/36|0]+B36[k%36]; }).join(""); }
  function decCards(s){ if(typeof s!=="string"||s.length!==50) return null; const g=[];
    for(let i=0;i<50;i+=2){ const k=B36.indexOf(s[i])*36+B36.indexOf(s[i+1]); if(k<0||k>51) return null; g.push({r:2+(k>>2), s:k&3}); }
    return new Set(g.map(c=>c.r*4+c.s)).size===25 ? g : null; }
  function scoreOf(g, sys){ const keep=settings.scoring; settings.scoring=sys; try{ return computeLines(g).total; } finally{ settings.scoring=keep; } }
  // anything off the wire is untrusted: shape-check it and re-score the cards
  function clean(e){
    if(!e||typeof e!=="object") return null;
    const sys=e.sys==="english"?"english":(e.sys==="american"?"american":null); if(!sys) return null;
    const g=decCards(e.cards); if(!g) return null;
    const name=String(e.name||"").replace(/[\u0000-\u001f]/g,"").trim().slice(0,16); if(!name) return null;
    const at=+e.at, id=String(e.id||"").slice(0,24); if(!at||!id) return null;
    const score=scoreOf(g,sys); if(score!==+e.score || score<=0) return null;
    return {id,name,score,sys,at,cards:e.cards};
  }
  function merge(list){
    let changed=false;
    list.forEach(raw=>{ const e=clean(raw); if(!e) return; const L=board[e.sys];
      if(L.some(x=>x.id===e.id)) return; L.push(e); changed=true; });
    ["american","english"].forEach(s=>{ board[s].sort((x,y)=>y.score-x.score||x.at-y.at); board[s]=board[s].slice(0,TOP); });
    if(changed) save(KB,board);
    return changed;
  }
  function post(obj){
    return fetch(RELAY+TOPIC,{method:"POST", body:JSON.stringify(obj)}).then(r=>{ if(!r.ok) throw new Error(r.status); });
  }
  function withTimeout(url,ms){
    const ctrl=window.AbortController?new AbortController():null, to=setTimeout(()=>ctrl&&ctrl.abort(),ms);
    return fetch(url, ctrl?{signal:ctrl.signal,cache:"no-store"}:{cache:"no-store"}).finally(()=>clearTimeout(to));
  }
  function sync(){
    if(syncing) return syncing;
    status="Checking the board…"; paint();
    syncing=withTimeout(RELAY+TOPIC+"/json?poll=1&since=all",12000).then(r=>{ if(!r.ok) throw new Error(r.status); return r.text(); }).then(txt=>{
      let lastBoard=0; const got=[];
      txt.split("\n").forEach(line=>{ if(!line) return; let m,o; try{ m=JSON.parse(line); o=JSON.parse(m.message); }catch(e){ return; }
        if(o.t==="score") got.push(o.e);
        else if(o.t==="board" && o.b){ (o.b.american||[]).concat(o.b.english||[]).forEach(x=>got.push(x)); lastBoard=Math.max(lastBoard,m.time*1000); } });
      merge(got);
      // anything we couldn't send earlier goes now
      const p=pending.slice(); pending=[]; save(KP,pending);
      p.forEach(e=>post({t:"score",e}).catch(()=>{ pending.push(e); save(KP,pending); }));
      // carry the board across ntfy's 12-hour memory
