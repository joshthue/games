<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Game Night</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0d5c3f">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Game Night">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root{ --felt:#0d5c3f; --felt2:#0a4a33; --gold:#f0c674; --cream:#f7f3e8; --ink:#1c2a24; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;min-height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(circle at 50% 12%, var(--felt) 0%, var(--felt2) 70%, #063324 100%);
    color:var(--cream); min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:max(20px,env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));}
  .wrap{width:100%; max-width:560px;}
  header{text-align:center; margin:10px 0 20px;}
  h1{font-size:30px; margin:0; letter-spacing:2px; color:var(--gold); text-shadow:0 2px 4px rgba(0,0,0,.5);}
  header p{margin:6px 0 0; font-size:13px; opacity:.75; letter-spacing:1px;}
  .grid{display:flex; flex-direction:column; gap:12px;}
  .tile{display:flex; align-items:center; gap:14px; text-decoration:none; color:var(--cream);
    background:rgba(255,255,255,.07); border:2px solid rgba(240,198,116,.28); border-radius:16px;
    padding:16px 16px; transition:transform .08s ease, border-color .15s ease, background .15s ease;}
  .tile:hover{border-color:var(--gold); background:rgba(255,255,255,.12);}
  .tile:active{transform:scale(.98);}
  .emoji{font-size:34px; width:56px; height:56px; flex:0 0 auto; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(180deg,#12503a,#0c3d2c); border-radius:14px; border:1px solid rgba(240,198,116,.25);}
  .meta{flex:1; min-width:0;}
  .meta .t{font-size:19px; font-weight:800; color:var(--gold);}
  .meta .s{font-size:12.5px; opacity:.8; margin-top:2px; line-height:1.35;}
  .meta .u{font-size:11px; opacity:.5; margin-top:3px; letter-spacing:.3px;}
  .arrow{opacity:.5; font-size:22px;}
  .ext{font-size:10px; letter-spacing:1px; opacity:.6; margin-left:6px; border:1px solid rgba(255,255,255,.3); border-radius:8px; padding:1px 5px; vertical-align:middle;}
  .install{margin:18px 0 4px; text-align:center;}
  .install button{font-family:inherit; font-weight:700; background:var(--gold); color:var(--ink); border:none;
    border-radius:12px; padding:11px 18px; font-size:14px; box-shadow:0 2px 6px rgba(0,0,0,.35); cursor:pointer;}
  .hint{margin-top:12px; font-size:12px; opacity:.72; line-height:1.5; text-align:center; background:rgba(0,0,0,.2);
    border-radius:12px; padding:10px 14px; display:none;}
  .hint.show{display:block;} .hint b{color:var(--gold);}
  footer{margin-top:22px; text-align:center; font-size:11px; opacity:.5;}
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>🎴 GAME NIGHT</h1>
      <p>PICK A GAME</p>
    </header>

    <div class="grid" id="grid"></div>

    <div class="install">
      <button id="installBtn" style="display:none;">📲 Install this app</button>
      <div class="hint" id="iosHint"><b>Add to your home screen:</b> tap the Share button, then “Add to Home Screen.” It’ll open like a real app.</div>
    </div>

    <footer>Add a game: make a folder with an index.html, then add one line above.</footer>
  </div>

<script>
/* ============================================================
   GAME NIGHT — hub / launcher.
   TO ADD A GAME: drop its .html file into this repo, then add one
   line to the GAMES array below. That's it.
   ============================================================ */
const GAMES = [
  { title:"Rat",             emoji:"🐀", sub:"The Leech Lake Game · trick-taking, last one standing", href:"theleechlakegame/", updated:"2026-08-11" },
  { title:"Cribbage",        emoji:"🃏", sub:"Classic to 121 · vs computer or two phones",            href:"cribbage/", updated:"2026-08-10" },
  { title:"Game Night Bingo", emoji:"🎯", sub:"On Patrol or football · rooms, teams & shared cards",     href:"bingo/", updated:"2026-09-05" },
  { title:"Three-Card Poker", emoji:"🎰", sub:"Ante, Play & Pair Plus vs the dealer",              href:"threecardpoker/", updated:"2026-08-10" },
  { title:"Ultimate Texas Hold'em", emoji:"🤠", sub:"You vs the dealer · community cards",             href:"ultimatetexasholdem/", updated:"2026-08-10" },
  { title:"Hold'em",          emoji:"♠️", sub:"6-player sit & go · you vs five bots",              href:"holdem/", updated:"2026-09-07" },
  { title:"Spite & Malice",   emoji:"😈", sub:"Race to empty your goal pile · vs bot or two phones", href:"spiteandmalice/", updated:"2026-09-12" },
  { title:"Blackjack",        emoji:"🂡", sub:"You vs the dealer · splits, doubles, 3:2 · bankroll", href:"blackjack/", updated:"2026-09-12" },
  // { title:"New Game", emoji:"🎲", sub:"make a folder with an index.html, then add one line here", href:"newgame/" },
];

function fmtDate(iso){ if(!iso) return ""; const p=iso.split("-").map(Number); const mo=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][p[1]-1]; return mo+" "+p[2]+", "+p[0]; }
function fmtLocal(iso){ try{ return new Date(iso).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}); }catch(e){ return ""; } }
const REPO="joshthue/games";
const grid=document.getElementById("grid");
GAMES.forEach(g=>{
  const a=document.createElement("a");
  a.className="tile"; a.href=g.href;
  if(g.external){ a.target="_blank"; a.rel="noopener"; }
  a.innerHTML=`<div class="emoji">${g.emoji}</div>
    <div class="meta"><div class="t">${g.title}${g.external?'<span class="ext">EXISTING</span>':''}</div><div class="s">${g.sub}</div>${g.updated?`<div class="u">Updated ${fmtDate(g.updated)}</div>`:''}</div>
    <div class="arrow">›</div>`;
  grid.appendChild(a);
  // Keep the tile date honest: fetch the real last-commit date from GitHub (best-effort; the baked date shows offline).
  const uEl=a.querySelector(".u");
  if(uEl && g.href && !g.external){
    const path=g.href.replace(/\/$/,"")+"/index.html";
    fetch(`https://api.github.com/repos/${REPO}/commits?path=${encodeURIComponent(path)}&per_page=1`)
      .then(r=>r.ok?r.json():null)
      .then(j=>{ if(j&&j[0]&&j[0].commit&&j[0].commit.committer){ const d=fmtLocal(j[0].commit.committer.date); if(d) uEl.textContent="Updated "+d; } })
      .catch(()=>{});
  }
});

// Install support: Android/Chrome shows a real button; iOS gets a hint.
let deferred=null;
window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); deferred=e;
  const b=document.getElementById("installBtn"); b.style.display="inline-block";
  b.onclick=async()=>{ b.style.display="none"; deferred.prompt(); await deferred.userChoice; deferred=null; };
});
(function(){
  const isiOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
  const standalone = window.navigator.standalone || (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
  if(isiOS && !standalone) document.getElementById("iosHint").classList.add("show");
})();

// keep the app current: never let the browser serve a cached sw.js, and reload
// once when a new worker takes over
if("serviceWorker" in navigator){
  addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js", {updateViaCache:"none"}).then(function(reg){
      reg.update();
      setInterval(function(){ reg.update(); }, 60*60*1000);
    }).catch(function(){});
    var reloaded=false;
    navigator.serviceWorker.addEventListener("controllerchange", function(){
      if(reloaded) return; reloaded=true; location.reload();
    });
  });
}
</script>
<div class="gn-build" id="gnBuild"></div>
<style>.gn-build{text-align:center;font-size:10.5px;opacity:.5;margin:16px 0 10px;
  font-family:ui-monospace,Menlo,monospace;letter-spacing:.3px;}</style>
<script>
/* build stamp — bumped with the sw.js cache version */
(function(){
  var V="v57", ISO="2026-09-12T19:30:00Z";
  var d=new Date(ISO), when=isNaN(d)?ISO:d.toLocaleString([], {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"});
  var el=document.getElementById("gnBuild"); if(el) el.textContent="build "+V+" \u00b7 "+when;
})();
</script>
</body>
</html>
